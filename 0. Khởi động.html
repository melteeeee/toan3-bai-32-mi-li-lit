<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Khởi động | Toán 3 – Bài 32 | YooBook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#195856; --brand-dark:#0f3f3d; --brand-light:#2f827d; --brand-soft:#e6f0ee;
  --ink:#10302d; --muted:#5f8b89; --line:#dbe8e5; --gold:#a8814a;
  --ok:#6fa85b; --bad:#c96a4f; --r:16px; --r-sm:11px;
  --sh-1:0 1px 2px rgba(13,42,40,.05);
  --sh-2:0 2px 6px rgba(13,42,40,.06),0 18px 34px -22px rgba(13,42,40,.45);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:'Roboto',system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px;line-height:1.5;color:var(--ink);background:#195658;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
.app{height:100dvh;display:flex;flex-direction:column}

/* intro */
.intro{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#2f827d 0,#195856 55%,#0b2a29 100%);transition:opacity .4s}
.intro::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.06),rgba(0,0,0,.22) 56%,rgba(0,0,0,.42));pointer-events:none}
.intro.gone{opacity:0;pointer-events:none}
.intro-inner{position:relative;z-index:2;width:100%;max-width:920px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;color:#fff}
.intro-card{width:min(92vw,980px);padding:8px 12px 12px;text-align:center}
.intro-kicker{font-size:12px;font-weight:700;letter-spacing:.20em;text-transform:uppercase;color:rgba(248,252,252,.92)}
.intro-card h1{font-size:clamp(30px,5vw,58px);margin:10px 0 12px;color:#fff;line-height:1.1;font-weight:800;text-shadow:0 4px 18px rgba(0,0,0,.26)}
.intro-sub{max-width:720px;margin:0 auto 26px;font-size:clamp(13px,1.6vw,18px);line-height:1.7;color:rgba(244,249,249,.96);text-shadow:0 2px 10px rgba(0,0,0,.22)}
.intro-progress{width:min(410px,72vw);height:3px;margin:0 auto 14px;border-radius:99px;background:rgba(255,255,255,.36);overflow:hidden;transition:opacity .3s}
.intro-progress span{display:block;height:100%;width:0;background:#d7e779;transition:width .25s linear}
#introStatus{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.ready-dot{width:8px;height:8px;border-radius:99px;background:#d7e779;display:inline-block;margin-right:7px;box-shadow:0 0 10px rgba(215,231,121,.6)}
.intro-explore{margin:20px auto 0;width:min(280px,88vw);padding:14px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.16);cursor:pointer;background:rgba(21,92,88,.76);box-shadow:0 16px 42px -20px rgba(0,0,0,.6);color:#fff;font-weight:700;font-size:15px;letter-spacing:.02em;opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .28s,transform .28s,background .2s}
.intro.ready .intro-explore{opacity:1;transform:none;pointer-events:auto}
.intro.ready .intro-progress{opacity:0}
.intro-explore:hover{background:rgba(21,92,88,.92)}
.intro-credit{margin-top:20px;color:rgba(255,255,255,.88);font-size:12px}
.btn{border:0;cursor:pointer;font-weight:700;font-size:15px;color:#fff;background:var(--brand);border-radius:99px;padding:11px 26px;box-shadow:0 8px 18px -8px rgba(15,63,61,.7);transition:transform .15s,background .15s}
.btn:hover{background:var(--brand-light);transform:translateY(-1px)}
.btn.alt{background:#fff;color:var(--brand-dark);border:1.5px solid var(--brand);box-shadow:none}
.btn.alt:hover{background:var(--brand-soft)}
.btn[disabled]{opacity:.4;pointer-events:none}

/* topbar */
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);box-shadow:var(--sh-1);flex:0 0 auto}
.logoclip{height:27px;display:flex;align-items:center;flex:0 0 auto}.logo{height:27px;display:block}
.titles{flex:1;min-width:0}
.badge{display:inline-block;max-width:100%;font-size:11px;font-weight:600;color:var(--brand);background:var(--brand-soft);border-radius:99px;padding:2px 9px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titles h1{margin:0;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;gap:8px;flex:0 0 auto}
.tb-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;color:var(--brand-dark);transition:background .15s,border-color .15s}
.tb-btn:hover{background:var(--brand-soft);border-color:var(--brand-light)}
.tb-btn svg{width:18px;height:18px}

.main{flex:1;min-height:0;padding:14px;display:flex}
.frame{flex:1;min-width:0;background:#fff;border-radius:var(--r);box-shadow:var(--sh-2);display:flex;flex-direction:column;overflow:hidden}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#2f827d 0,#195856 62%,#0f3f3d 100%)}
.pane{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
#pane1{z-index:20;padding:18px 62px}
.steps{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;border-top:1px solid var(--line);scrollbar-width:none;flex:0 0 auto}
.steps::-webkit-scrollbar{display:none}
.vignette{position:absolute;inset:0;z-index:1;pointer-events:none;box-shadow:inset 0 0 90px rgba(15,63,61,.10)}
.stage-nav{position:absolute;top:50%;z-index:30;transform:translateY(-50%);width:38px;height:38px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.88);backdrop-filter:blur(8px) saturate(1.3);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--brand-dark);box-shadow:var(--sh-1);font-size:16px}
.stage-nav:hover{background:var(--brand-soft)}
.stage-nav.prev{left:12px}.stage-nav.next{right:12px}.stage-nav[disabled]{opacity:.3;pointer-events:none}
.stage-tools{position:absolute;left:12px;top:12px;z-index:12}
.ghost{background:rgba(255,255,255,.9);backdrop-filter:blur(8px) saturate(1.3);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 11px;font-size:12.5px;font-weight:500;color:var(--brand-dark);cursor:pointer;box-shadow:var(--sh-1)}
.ghost:hover{background:var(--brand-soft)}
.step{flex:0 0 auto;white-space:nowrap;display:flex;align-items:center;gap:7px;padding:7px 14px 7px 8px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink)}
.step:hover{border-color:var(--brand-light)}
.step b{width:20px;height:20px;border-radius:99px;background:var(--brand-soft);color:var(--brand-dark);font-size:11px;display:flex;align-items:center;justify-content:center}
.step[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.step[aria-pressed="true"] b{background:rgba(255,255,255,.25);color:#fff}
.step.done b{background:var(--brand);color:#fff}
.step.is-locked{opacity:.42;filter:saturate(.35);pointer-events:none}
.step.is-locked::after{content:"Khóa";margin-left:2px;font-size:11px;color:var(--muted)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(25,88,86,.4)}50%{box-shadow:0 0 0 7px rgba(25,88,86,0)}}
.step.just{animation:pulse 1.2s ease 2}

/* ===== video dựng bằng HTML/SVG ===== */
.player{position:absolute;inset:0;overflow:hidden;background:#0b2a29;display:flex;align-items:center;justify-content:center}
.film{width:100%;height:100%;display:block}
.film .sc{opacity:0;transition:opacity .6s}
.film .sc.on{opacity:1}
.cap{position:absolute;left:0;right:0;bottom:64px;text-align:center;z-index:5;padding:0 6%;pointer-events:none}
.cap span{display:inline-block;background:rgba(15,63,61,.88);color:#fff;font-weight:700;font-size:clamp(15px,2.4vw,24px);line-height:1.35;padding:8px 20px;border-radius:18px;transition:opacity .3s}
.cap span:empty{opacity:0}
.ctrl{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;gap:10px;padding:10px 62px 12px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.ctrl button{width:36px;height:36px;border-radius:99px;border:0;background:rgba(255,255,255,.92);cursor:pointer;color:var(--brand-dark);font-size:13px;flex:0 0 auto}
.bar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.35);overflow:hidden;cursor:pointer}
.bar i{display:block;height:100%;width:0;background:#ffd98a}
.time{color:#fff;font-size:12px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.start-ov{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);cursor:pointer}
.start-ov div{width:76px;height:76px;border-radius:50%;background:#fff;color:var(--brand);font-size:32px;display:flex;align-items:center;justify-content:center;padding-left:6px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.vq{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:18px 62px 70px;background:rgba(11,42,41,.45);backdrop-filter:blur(3px);animation:up .4s}
.vq-card{width:min(100%,560px);background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px -12px rgba(13,42,40,.45);padding:20px 22px;text-align:center}
.vq-card h2{margin:6px 0 16px;font-size:clamp(18px,3vw,26px);font-weight:700;color:var(--brand-dark)}
.vq-card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pulse{animation:svgPulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes svgPulse{50%{opacity:.35}}

/* ===== hỏi đáp ===== */
#pane1{background:rgba(11,42,41,.55);backdrop-filter:blur(4px)}
.qa{width:min(100%,820px);max-height:100%;overflow:auto;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:0 10px 30px -12px rgba(13,42,40,.45)}
.kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{position:relative;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border:2px solid var(--line);background:#fff;border-radius:var(--r);cursor:pointer;font-size:15px;font-weight:500;color:var(--ink);transition:transform .15s,border-color .15s,background .15s}
.card:hover{border-color:var(--brand-light);transform:translateY(-2px)}
.card .ic{flex:0 0 auto;width:46px;height:46px;border-radius:12px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:26px}
.card .ck{margin-left:auto;flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.card[aria-pressed="true"]{border-color:var(--brand);background:#f1f9f7}
.card[aria-pressed="true"] .ck{background:var(--brand);border-color:var(--brand)}
.qimg{display:flex;justify-content:center;margin:6px 0 4px}
.other{margin-top:12px}
.other label{font-weight:600;font-size:13.5px;color:var(--brand-dark)}
.other textarea{display:block;width:100%;margin-top:4px;border:2px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;font:inherit;resize:none;min-height:56px;outline:none}
.other textarea:focus{border-color:var(--brand-light)}
.actions{margin-top:14px;display:flex;justify-content:flex-end;gap:10px}
.fb{margin-top:14px;border-radius:var(--r);background:#f1f9f7;border:1.5px solid var(--brand-light);padding:14px 16px;animation:up .4s}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.fb ul{margin:6px 0;padding-left:20px}
.fb li{margin:2px 0}
.fb .mine{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
.fb .mine span{font-size:12.5px;font-weight:600;border-radius:99px;padding:2px 10px;background:#fff;border:1px solid var(--line)}
.fb .note{background:#fff7e8;border-left:4px solid var(--gold);border-radius:8px;padding:7px 12px;font-size:13.5px;margin:8px 0}
.fb .go{margin-top:10px;text-align:right}

.toast{position:absolute;left:50%;bottom:56px;z-index:40;transform:translate(-50%,20px);background:var(--brand-dark);color:#fff;font-weight:600;padding:8px 18px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:640px){
  .cards{grid-template-columns:1fr}
  .qa{padding:16px}
  .main{padding:8px}
  .titles h1{font-size:16px}
  .ctrl{padding:8px 50px 10px}
  .cap{bottom:56px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
let muted=false;

/* ===== âm thanh ===== */
const audio=(()=>{let ctx=null;
  const ac=()=>{try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}return ctx};
  const tone=(f,t,d,type,v)=>{const c=ac();if(!c||muted)return;const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;
    const s=c.currentTime+t;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v||.08,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);
    o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d+.03)};
  return{click:()=>tone(660,0,.08,'triangle',.07),ok:()=>{tone(523,0,.13,'sine',.11);tone(659,.1,.13,'sine',.11);tone(784,.2,.25,'sine',.11)}}})();
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200)}

/* ---- thuyết minh: mã → link mp3 (xem thuyet-minh.json); để trống thì chỉ hiện phụ đề ---- */

  '2.2':'https://assets.yoolife.com.vn/yootek/1794903814442-4507.mp3'
};
const voice=new Audio();
function stopVoice(){voice.pause();}
function unlockVoice(){if(voice.src||!VO['1.1'])return;voice.muted=true;voice.src=VO['1.1'];voice.play().catch(()=>{});}
function playVoice(id){stopVoice();if(muted||!VO[id])return;voice.muted=false;voice.src=VO[id];voice.currentTime=0;voice.play().catch(()=>{});}

/* ===== các bước ===== */
const STEPS=['Xem video','Hỏi đáp'];
let cur=0,unlocked=STEPS.length-1,doneSet=new Set();
const stepsEl=$('steps');
function renderSteps(){
  stepsEl.innerHTML='';
  STEPS.forEach((n,i)=>{
    const b=document.createElement('button');b.type='button';b.className='step'+(doneSet.has(i)?' done':'')+(i>unlocked?' is-locked':'');
    b.setAttribute('role','tab');b.setAttribute('aria-pressed',i===cur);
    b.innerHTML='<b>'+(doneSet.has(i)?'✓':i+1)+'</b>'+n;b.onclick=()=>go(i);stepsEl.appendChild(b)});
}
function go(i){
  if(i>unlocked)return;cur=i;
  $('pane1').hidden=i!==1;
  $('btnPrev').disabled=i<=0;$('btnNext').disabled=i>=STEPS.length-1;
  stopVoice();
  if(i!==0)pause();
  renderSteps();
}
$('btnPrev').onclick=()=>go(cur-1);$('btnNext').onclick=()=>go(cur+1);

/* =====================================================================

const film=$('film');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,k)=>a+(b-a)*k;
/* ---------- thư viện hình (chuỗi SVG) ---------- */
const shadow=(cx,cy,rx,ry=rx*.16)=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#shd)"/>`;
const sparkle=(x,y,s=1,c='#ffd23f')=>`<path transform="translate(${x} ${y}) scale(${s})" d="M0,-16 L4,-4 L16,0 L4,4 L0,16 L-4,4 L-16,0 L-4,-4 Z" fill="${c}"/>`;
/* phông: tường + gạch ốp + mặt bàn gỗ */
function bg({wall,tile='#ffffff',top=440,win=null,deco=''}){
  let s=`<rect width="960" height="540" fill="url(#${wall})"/>
  <rect y="${top-150}" width="960" height="150" fill="url(#tiles)" opacity=".55"/>`;
  if(win){const [x,y,w,h]=win;
    s+=`<rect x="${x-10}" y="${y-10}" width="${w+20}" height="${h+20}" rx="14" fill="#fff" stroke="#e3d6c4" stroke-width="3"/>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="url(#sky)"/>
    <circle cx="${x+w*.78}" cy="${y+h*.3}" r="${h*.13}" fill="#ffe27a"/>
    <g fill="#fff" opacity=".95"><ellipse cx="${x+w*.3}" cy="${y+h*.35}" rx="${w*.14}" ry="${h*.08}"/><ellipse cx="${x+w*.4}" cy="${y+h*.3}" rx="${w*.1}" ry="${h*.09}"/></g>
    <path d="M${x+w*.55},${y+h} q${w*.15},-${h*.35} ${w*.45},-${h*.25} v${h*.25} z" fill="#9fd88a"/>
    <line x1="${x+w/2}" y1="${y}" x2="${x+w/2}" y2="${y+h}" stroke="#fff" stroke-width="7"/><line x1="${x}" y1="${y+h/2}" x2="${x+w}" y2="${y+h/2}" stroke="#fff" stroke-width="7"/>
    <path d="M${x-26},${y-18} h${w*.32} q-${w*.08},${h*.6} -${w*.32},${h+30} z" fill="#f59ab0" opacity=".9"/>
    <path d="M${x+w+26},${y-18} h-${w*.32} q${w*.08},${h*.6} ${w*.32},${h+30} z" fill="#f59ab0" opacity=".9"/>`;}
  s+=deco;
  s+=`<rect y="${top}" width="960" height="${540-top}" fill="url(#wood)"/>
  <rect y="${top}" width="960" height="10" fill="#fff" opacity=".35"/>
  <g stroke="#b9895a" stroke-width="2" opacity=".35" fill="none"><path d="M0,${top+40} q240,-10 480,0 t480,0"/><path d="M0,${top+75} q300,8 600,-2 t360,4"/></g>`;
  return s;
}
/* gương mặt bạn nhỏ: mood = happy | sick | think | baby */
function face(x,y,r,mood='happy',hair='#3b2a20'){
  const eyeY=y+r*.08,ex=r*.36;

  if(mood==='sick'){eyes=[-1,1].map(d=>`<path d="M${x+d*ex-r*.12},${eyeY} Q${x+d*ex},${eyeY+r*.09} ${x+d*ex+r*.12},${eyeY}" stroke="#2b1d16" stroke-width="${r*.05}" fill="none" stroke-linecap="round"/>`).join('');
    mouth=`<path d="M${x-r*.16},${y+r*.48} q${r*.08},-${r*.08} ${r*.16},0 t${r*.16},0" stroke="#8d3b2f" stroke-width="${r*.05}" fill="none" stroke-linecap="round"/>`;
    extra=`<g transform="translate(${x+r*.12} ${y+r*.46}) rotate(-25)"><rect x="0" y="-${r*.05}" width="${r*.85}" height="${r*.1}" rx="${r*.05}" fill="#fff" stroke="#9aa7ad" stroke-width="2"/><rect x="${r*.62}" y="-${r*.05}" width="${r*.23}" height="${r*.1}" rx="${r*.05}" fill="#e74c3c"/></g>

    ?`<path d="M${x-r*.05},${y-r*.98} q${r*.3},-${r*.22} ${r*.18},${r*.12} q-${r*.08},${r*.1} -${r*.2},-${r*.02}" fill="none" stroke="#8a5a2b" stroke-width="${r*.07}" stroke-linecap="round"/>`
    :`<path d="M${x-r*1.02},${y-r*.05} Q${x-r*.95},${y-r*1.15} ${x},${y-r*1.08} Q${x+r*.95},${y-r*1.15} ${x+r*1.02},${y-r*.05} Q${x+r*.6},${y-r*.62} ${x+r*.1},${y-r*.5} Q${x-r*.4},${y-r*.72} ${x-r*1.02},${y-r*.05} Z" fill="${hair}"/>`;

    <text x="725" y="146" text-anchor="middle" font-size="30" font-weight="800" fill="#0f3f3d">Ít hơn 1 l</text>
    <text x="725" y="188" text-anchor="middle" font-size="30" font-weight="800" fill="#d6382f">đo bằng … ?</text>
  </g>
  <text id="s3m" x="470" y="230" text-anchor="middle" font-size="130" font-weight="800" fill="#f3a712" stroke="#fff" stroke-width="5" paint-order="stroke" opacity="0" class="pulse">?</text>
</g></g>`;
const E=id=>document.getElementById(id);
function setLevel(r,bot,h){r.setAttribute('y',bot-h);r.setAttribute('height',h+4);}
/* toạ độ miệng (local mx,my) của vật khi đặt ở (tx,ty) và xoay r độ */
const tip=(mx,my,tx,ty,r)=>{const a=r*Math.PI/180;return[tx+mx*Math.cos(a)-my*Math.sin(a),ty+mx*Math.sin(a)+my*Math.cos(a)];};
const stream=(g,x,y1,y2,on)=>{const rim=+g.dataset.rim,m=Math.max(y1,Math.min(y2,rim));[[g.children[0],y1,m],[g.children[1],m,y2]].forEach(([r,a,b])=>{r.setAttribute('x',x-r.getAttribute('width')/2);r.setAttribute('y',a);r.setAttribute('height',Math.max(0,b-a));});g.setAttribute('opacity',on?1:0);};
function render(t){
  const s=Math.min(3,Math.floor(t/SC)),lt=t-s*SC;
  for(let i=0;i<4;i++)E('sc'+i).classList.toggle('on',i===s);
  const kb=1+0.045*clamp(lt/SC);E('kb'+s).setAttribute('transform',`translate(480 270) scale(${kb}) translate(-480 -270)`);
  // cảnh 1: mở núm, rót nước từ ấm tới vạch 120
  { const lift=clamp((t-7.6)/0.7)-clamp((t-13.6)/0.7);
    E('s0n').setAttribute('transform',`translate(${-150*lift} ${-40*lift}) rotate(${-25*lift} 440 160)`);E('s0n').setAttribute('opacity',1-lift*.25);
    const ki=clamp((t-8.2)/0.8)-clamp((t-13.4)/0.8),R=-32*ki,TX=lerp(1060,538,ki),TY=95;
    E('s0k').setAttribute('transform',`translate(${TX} ${TY}) rotate(${R})`);
    const k=clamp((t-9)/4),lvl=120*1.4*k,sf=404-lvl;setLevel(E('s0w'),416,12+lvl);
    E('s0sf').setAttribute('cy',sf-6);E('s0sf').setAttribute('opacity',k>0?.8:0);
    const [px,py]=tip(-90,-27,TX,TY,R);stream(E('s0s'),px,py,sf-6,t>=9&&t<13);
    E('s0h').setAttribute('opacity',t>=13.2&&t<15?1:0);E('s0h').firstChild.setAttribute('cy',404-120*1.4);
    E('s0t').setAttribute('opacity',t>=4.5&&t<9?(Math.sin(t*6)>0?1:.55):1); }
  // cảnh 2: rót siro tới vạch 5 ml
  { const tilt=clamp((t-21.5)/0.8)-clamp((t-27)/0.8),x=lerp(380,740,tilt),y=lerp(350,190,tilt),r=lerp(0,-112,tilt);
    E('s1b').setAttribute('transform',`translate(${x} ${y}) rotate(${r})`);
    const k=clamp((t-22.6)/3),sf=432-5*4.2*k;setLevel(E('s1w'),446,14+5*4.2*k);
    const [px,py]=tip(0,-164,x,y,r);stream(E('s1s'),px,py,sf,t>=22.6&&t<25.6);
    E('s1h').setAttribute('opacity',t>=25.6&&t<30?1:0); }
  // cảnh 3: rót nước từ bình, nước dâng tới vạch 200
  { const pi=clamp((t-38.4)/0.9)-clamp((t-43.6)/0.9),R=-50*pi,TX=lerp(1080,624,pi),TY=63;
    E('s2p').setAttribute('transform',`translate(${TX} ${TY}) rotate(${R})`);
    const k=clamp((t-39.5)/4),lvl=200*1.04*k,sf=430-lvl;setLevel(E('s2w'),444,14+lvl);
    E('s2sf').setAttribute('cy',sf-4);E('s2sf').setAttribute('opacity',k>0?.75:0);
    const [px,py]=tip(-64,-77,TX,TY,R);stream(E('s2s'),px,py,sf-4,t>=39.5&&t<43.5);
    [...E('s2bub').children].forEach(c=>{const ph=((t*0.9+ +c.dataset.o)%2.4)/2.4,on=k>0&&t<45;c.setAttribute('cy',440-ph*(440-sf));c.setAttribute('opacity',on?.7*(1-ph):0);});
    E('s2h').setAttribute('opacity',t>=43.5&&t<45?1:0);E('s2h').firstChild.setAttribute('cy',430-200*1.04); }
  // cảnh 4: chai 1 l rót ra cốc nhỏ, câu hỏi
  { const tilt=clamp((t-49)/0.8)-clamp((t-53)/0.8),TX=lerp(300,477,tilt),TY=lerp(298,269,tilt),R=lerp(0,100,tilt);
    E('s3b').setAttribute('transform',`translate(${TX} ${TY}) rotate(${R})`);
    const k=clamp((t-49.8)/2.6),sf=440-70*k;setLevel(E('s3w'),450,10+70*k);
    const [px,py]=tip(0,-178,TX,TY,R);stream(E('s3s'),px,py,sf,t>=49.8&&t<52.4);
    E('s3q').setAttribute('opacity',t>=52?1:0);E('s3m').setAttribute('opacity',t>=54.5?1:0); }
}
/* trình phát */
let T=0,playing=false,last=0,raf=0,cueIdx=-1,ended=false;
const fmt=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
function paint(){
  render(T);$('fill').style.width=T/DUR*100+'%';$('time').textContent=`${fmt(T)} / ${fmt(DUR)}`;
  let k=-1;CUES.forEach((c,j)=>{if(T>=c[0])k=j;});
  if(k!==cueIdx){cueIdx=k;$('sub').textContent=k>=0?CUES[k][2]:'';if(playing&&k>=0)playVoice(CUES[k][1]);}
}
function tick(now){if(!playing)return;T+=(now-last)/1000;last=now;
  if(T>=DUR){T=DUR;paint();pause();finish();return;}
  if(T>=DUR-2)showQ();
  paint();raf=requestAnimationFrame(tick);}
function play(){if(T>=DUR){seek(0);}hideQ();playing=true;last=performance.now();$('pp').textContent='❚❚';$('startOv').hidden=true;
  if(!voice.src||voice.muted)cueIdx=-2;else if(cueIdx>=0&&voice.paused&&!voice.ended)voice.play().catch(()=>{});raf=requestAnimationFrame(tick);}
function pause(){playing=false;cancelAnimationFrame(raf);$('pp').textContent='▶';voice.pause();}
function seek(t){T=clamp(t,0,DUR);cueIdx=-2;stopVoice();if(T<DUR-2.2)hideQ();paint();}
function showQ(){$('vq').hidden=false;}
function hideQ(){$('vq').hidden=true;}
function finish(){showQ();doneSet.add(0);renderSteps();}
$('pp').onclick=()=>{audio.click();playing?pause():play();};
$('rw').onclick=()=>{seek(0);play();};
$('startOv').onclick=()=>play();
$('bar').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();seek((e.clientX-r.left)/r.width*DUR);};
$('vqGo').onclick=()=>{audio.click();go(1);playVoice('2.1');};
$('vqReplay').onclick=()=>{seek(0);play();};
paint();

/* ===== hỏi đáp ===== */
$('qimg').innerHTML=`<svg viewBox="0 0 220 170" width="190" height="146" aria-label="Cốc có chia vạch">
  <path d="M150,40 C188,40 188,130 148,128" fill="none" stroke="#c6dde4" stroke-width="12" stroke-linecap="round"/>
  <path d="M50,20 L152,20 L147,152 Q146,160 138,160 L64,160 Q56,160 55,152 Z" fill="#eaf6fb" stroke="#9cc4d1" stroke-width="3"/>
  ${ticks(60,152,0.5,10,250,10,50,v=>v,[8,16],12)}<text x="84" y="16" font-size="12" font-weight="800" fill="#22495a">ml</text></svg>`;
const OPTS=[
  {id:'a',ic:'📏',t:'Đo nước cho đúng',ok:true},
  {id:'b',ic:'🥤',t:'Biết cốc có bao nhiêu nước',ok:true},
  {id:'c',ic:'🎨',t:'Cho cốc đẹp hơn',ok:false},
  {id:'d',ic:'🔢',t:'Đếm số cốc',ok:false}
];
const picked=new Set();
const cardsEl=$('cards');
OPTS.forEach(o=>{
  const b=document.createElement('button');b.type='button';b.className='card';b.setAttribute('aria-pressed','false');
  b.innerHTML='<span class="ic">'+o.ic+'</span><span>'+o.t+'</span><span class="ck">✓</span>';
  b.onclick=()=>{audio.click();picked.has(o.id)?picked.delete(o.id):picked.add(o.id);b.setAttribute('aria-pressed',picked.has(o.id));upd()};
  cardsEl.appendChild(b)});
const own=$('own');
function upd(){$('btnSend').disabled=!(picked.size||own.value.trim())}
own.addEventListener('input',upd);
$('btnSend').onclick=()=>{
  audio.ok();playVoice('2.2');
  const chosen=OPTS.filter(o=>picked.has(o.id)),txt=own.value.trim();
  const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let h='<div class="mine">'+chosen.map(o=>'<span>'+o.ic+' '+o.t+'</span>').join('')+(txt?'<span>✏️ '+esc(txt)+'</span>':'')+'</div>';
  if(picked.has('c')||picked.has('d'))h+='<div class="note">Vạch chia giúp biết <b>lượng nước</b> đấy!</div>';
  h+='<p style="font-size:19px;margin:6px 0">📏 Vạch chia giúp <b>đo nước</b>.</p><p style="font-size:19px;margin:6px 0">Đơn vị: <b>ml</b> – mi-li-lít</p>';
  h+='<div style="font-size:18px">Cùng học <b>Mi-li-lít</b> nhé! 🔍</div><div class="go"><button class="btn" id="btnLesson" type="button">Vào bài học ▶</button></div>';
  const fb=$('fb');fb.innerHTML=h;fb.hidden=false;fb.scrollIntoView({behavior:'smooth',block:'nearest'});
  $('btnSend').disabled=true;doneSet.add(1);renderSteps();
  $('btnLesson').onclick=()=>{
    audio.click();
    try{parent.postMessage({type:'yoobook:next',from:'khoi-dong'},'*')}catch(e){}
    toast('Vào bài học!');
  };
};

/* ===== điều khiển chung ===== */
(()=>{let w=0;const b=$('introBar');const iv=setInterval(()=>{w=Math.min(100,w+14);b.style.width=w+'%';
  if(w>=100){clearInterval(iv);$('introStatus').innerHTML='<span class="ready-dot"></span>Đã sẵn sàng!';$('intro').classList.add('ready');}},110);})();
$('btnBegin').onclick=()=>{audio.click();unlockVoice();const i=$('intro');i.classList.add('gone');setTimeout(()=>i.style.display='none',420);setTimeout(play,450)};
$('btnMute').onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?'🔇':'🔊';e.currentTarget.setAttribute('aria-pressed',muted);if(muted)stopVoice()};
$('btnFs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
window.__lesson={goTo:go,seek,play};
renderSteps();$('btnPrev').disabled=true;
</script>
