<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Mi-li-lít | Toán 3 – Bài 32 | YooBook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#195856; --brand-dark:#0f3f3d; --brand-light:#2f827d; --brand-soft:#e6f0ee;
  --ink:#10302d; --muted:#5f8b89; --line:#dbe8e5; --stage-mid:#f1f9f7; --stage-bottom:#dcebe7;
  --ok:#6fa85b; --bad:#c96a4f; --gold:#ffcf5a; --red:#d6382f; --water:#5ab4e8;
  --r:16px; --r-sm:11px;
  --sh-1:0 1px 2px rgba(13,42,40,.05);
  --sh-2:0 2px 6px rgba(13,42,40,.06),0 18px 34px -22px rgba(13,42,40,.45);
  --sh-3:0 10px 30px -12px rgba(13,42,40,.32);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;color:var(--ink);background:#195658;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);box-shadow:var(--sh-1);z-index:20;flex:0 0 auto}
.logoclip{height:27px;display:flex;align-items:center;flex:0 0 auto}
.logo{height:27px;display:block}
.titles{flex:1;min-width:0}
.badge{display:inline-block;max-width:100%;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--brand);background:var(--brand-soft);border-radius:99px;padding:2px 9px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
.titles h1{margin:0;font-weight:700;font-size:18px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--brand-dark)}
.tb-btn:hover{background:var(--brand-soft);border-color:var(--brand-light)}
.main{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px;overflow:hidden}
.frame{background:#fff;border-radius:var(--r);box-shadow:var(--sh-2);display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.stage{position:relative;flex:1;min-height:0;background:radial-gradient(75% 80% at 32% 45%,#23706d 0%,#195658 55%,#123f3e 100%);overflow:hidden}
.vignette{position:absolute;inset:0;z-index:1;pointer-events:none;box-shadow:inset 0 0 90px rgba(15,63,61,.10)}
.stage-tools{position:absolute;left:12px;top:12px;z-index:6;display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:rgba(255,255,255,.90);backdrop-filter:blur(8px) saturate(1.3);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 11px;font-size:12.5px;font-weight:500;color:var(--brand-dark);cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:var(--sh-1)}
.ghost[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.stage-nav{position:absolute;top:50%;z-index:30;transform:translateY(-50%);width:38px;height:38px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.88);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--brand-dark);box-shadow:var(--sh-1);font-size:16px}
.stage-nav.prev{left:12px}.stage-nav.next{right:12px}
.stage-nav[disabled]{opacity:.3;pointer-events:none}
.stage-nav.nudge{animation:nudgePulse 1.2s ease infinite}
@keyframes nudgePulse{0%,100%{box-shadow:0 0 0 0 rgba(255,207,90,.8)}50%{box-shadow:0 0 0 10px rgba(255,207,90,0)}}

/* vùng tương tác 2D (bên trái) + bảng bài học (bên phải) */
.view{position:absolute;z-index:2;left:56px;top:54px;bottom:64px;right:calc(min(460px,42%) + 72px);touch-action:none;user-select:none;-webkit-user-select:none}
.view>svg{display:block;width:100%;height:100%;overflow:visible}
.lesson{position:absolute;z-index:7;right:60px;top:12px;bottom:12px;width:min(460px,42%);display:flex;flex-direction:column;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-radius:var(--r);box-shadow:var(--sh-3);overflow:hidden}
.sidebody{flex:1;min-height:0;overflow:auto;padding:18px 20px 16px;background:linear-gradient(#fff,var(--stage-mid) 70%,var(--stage-bottom))}
.sec{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chip{display:inline-block;font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:99px;padding:3px 11px;margin-bottom:6px}
.sec h2{margin:0 0 10px;font-size:22px;line-height:1.3;color:var(--brand-dark)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:14px 16px;margin:12px 0}
.card p{font-size:16px;line-height:1.6;margin:0}
.card p+p{margin-top:8px}
.kcard{border-radius:var(--r-sm);padding:12px 14px;margin-top:12px;border:1.5px solid var(--brand-light);background:#fff;box-shadow:var(--sh-1);animation:fade .35s ease}
.kcard .kh{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--brand);border-radius:99px;padding:4px 12px 4px 9px;margin-bottom:8px}
.kcard .kh::before{content:'';width:8px;height:8px;border-radius:50%;background:#fff}
.kcard p,.kcard li{margin:0;font-size:16px;line-height:1.6}
.kcard ul{margin:0;padding-left:20px}
.kcard li+li{margin-top:4px}
.red{color:var(--red);font-weight:700}
.say{display:flex;align-items:center;gap:12px;margin:4px 0 10px;padding:10px 14px;border-radius:14px;background:var(--brand-soft);border:1.5px solid #cfe3de;font-size:18px;line-height:1.45;font-weight:600;color:var(--brand-dark)}
.say>i{flex:0 0 40px;height:40px;border-radius:50%;background:#fff;box-shadow:var(--sh-1);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:22px}
.say.hint{background:transparent;border:0;padding:0 2px;display:block;font-size:16px;color:var(--muted)}
.kbig{font-size:26px!important;font-weight:800;color:var(--red);text-align:center;margin:4px 0!important}
.kmid{font-size:19px!important;text-align:center;margin:2px 0!important}
.cntq .lbl{font-size:19px!important}
.opt{font-size:18px!important}
.card p b{font-size:18px}
.kwd{font-weight:700;color:var(--brand-light)}
.nar{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand-light);border-radius:var(--r-sm);padding:10px 12px;margin:0 0 12px;box-shadow:var(--sh-1)}
.nar .av{flex:0 0 34px;height:34px;border-radius:50%;background:var(--brand-soft);font-size:20px;display:flex;align-items:center;justify-content:center}
.nar .tx{font-size:16px;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:8px;margin:10px 0 0}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:11px 13px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:16px;cursor:pointer}
.opt i{font-style:normal;flex:0 0 24px;height:24px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.opt:hover:not(:disabled){border-color:var(--brand-light);background:var(--stage-mid)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-dark);font-weight:600}
.opt.ok i{background:var(--brand);color:#fff}
.opt.no{border-color:var(--bad);background:#fbeae4;color:#a54527}
.opt.no i{background:var(--bad);color:#fff}
.fb{display:none;margin:10px 0 0;padding:10px 13px;border-radius:var(--r-sm);font-size:15.5px;line-height:1.6}
.fb.show{display:block;animation:fade .25s ease}
.fb.ok{background:var(--brand-soft);color:var(--brand-dark)}
.fb.no{background:#fbeae4;color:#a54527}
.fb.info{background:#fff6dd;color:#6b4d13}
.qbtn{border:0;border-radius:11px;padding:11px 20px;font-size:15.5px;font-weight:600;cursor:pointer;background:var(--brand);color:#fff;margin:10px 8px 0 0}
.qbtn:hover:not(:disabled){background:var(--brand-dark)}
.qbtn:disabled{opacity:.45;cursor:not-allowed}
.qbtn.alt{background:#fff;color:var(--brand-dark);border:1.5px solid var(--brand)}
.next-wrap{margin:16px 0 4px;display:flex;justify-content:flex-end}
.next-btn{margin:0;padding:12px 22px;animation:nudgePulse 1.4s ease .5s infinite}
.hint{font-size:13.5px;color:var(--muted);margin:8px 0 0}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* nhiệm vụ: ô tick bên phải, rót xong thì tick */
.say:not(.hint){position:relative;padding-right:52px}
.say:not(.hint)::after{content:'';position:absolute;right:14px;top:50%;width:26px;height:26px;margin-top:-13px;border-radius:50%;border:2.5px solid #9cc4bd;background:#fff;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff;transition:background .25s,border-color .25s,transform .25s}
.say.done{background:#eef7ea;border-color:#bfe0b2;color:#2f5a24}
.say.done::after{content:'✓';background:var(--ok);border-color:var(--ok);animation:tickPop .4s ease}
@keyframes tickPop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
/* danh sách kéo (bánh xe chọn số) */
.wheelq{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:14px 16px;margin:12px 0;animation:fade .3s ease}
.wheelq .wq{font-size:18px;font-weight:700;margin:0 0 10px;text-align:center}
.wheelq .wrow{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.wheel{position:relative;width:170px;height:156px;flex:0 0 auto}
.wheel::before{content:'';position:absolute;left:0;right:0;top:52px;height:52px;border-radius:12px;background:var(--brand-soft);border:2px solid var(--brand-light);pointer-events:none}
.wheel .wl{position:relative;height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);overscroll-behavior:contain;touch-action:pan-y;cursor:grab}
.wheel .wl::-webkit-scrollbar{display:none}
.wheel .wi{height:52px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:20px;font-weight:600;color:var(--muted);user-select:none;transition:color .15s,font-size .15s}
.wheel .wi.on{color:var(--brand-dark);font-size:24px;font-weight:800}
.wheel .wpad{height:52px}
.wheel.ok::before{background:#eef7ea;border-color:var(--ok)}
.wheel.no::before{background:#fbeae4;border-color:var(--bad);animation:shake .4s}
.wheelq .qbtn{margin:0}
/* chọn số (điền vào ô ?) */
.cntq{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:10px 12px;border-radius:var(--r-sm);background:#fff;border:1px solid var(--line);animation:fade .3s ease}
.cntq .lbl{flex:1 1 100%;font-size:16px;font-weight:600}
.cntq .lbl .box{display:inline-block;min-width:44px;padding:0 8px;border:2px solid #f3c64f;border-radius:8px;text-align:center;color:#b07a00;background:#fffaf0}
.cntq.done .lbl .box{border-color:var(--ok);color:#2f5a24;background:#eef7ea}
.cntq .nbs{display:flex;gap:8px;flex-wrap:wrap}
.cntq .nb{min-width:64px;height:46px;padding:0 12px;font-size:18px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;color:var(--brand-dark);cursor:pointer}
.cntq .nb:hover:not(:disabled){border-color:var(--brand-light);background:var(--stage-mid)}
.cntq .nb.ok{background:var(--brand);border-color:var(--brand);color:#fff}
.cntq .nb.no{background:#fbeae4;border-color:var(--bad);color:#a54527;animation:shake .4s}
.cntq .nb:disabled{cursor:default}
.prog{display:flex;gap:5px;margin:10px 0 0;flex-wrap:wrap}
.prog span{width:26px;height:10px;border-radius:99px;background:var(--line);transition:background .2s}
.prog span.ok{background:var(--ok)} .prog span.no{background:var(--bad)} .prog span.cur{background:var(--gold)}

/* thanh điều khiển (dưới khung tương tác) */
.dock{position:absolute;z-index:6;left:62px;right:calc(min(460px,42%) + 72px);bottom:12px;display:none;flex-wrap:wrap;justify-content:center;gap:6px;pointer-events:none}
.dock .grp{pointer-events:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:rgba(255,255,255,.93);backdrop-filter:blur(10px);border-radius:14px;padding:6px 8px;box-shadow:var(--sh-3)}
.dock .gl{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:0 4px}
.dk{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;min-height:38px;font-size:13.5px;font-weight:600;color:var(--brand-dark);cursor:pointer;white-space:nowrap;touch-action:none;user-select:none;-webkit-user-select:none}
.dk:hover:not(:disabled){border-color:var(--brand-light);background:var(--stage-mid)}
.dk.on{background:var(--brand);border-color:var(--brand);color:#fff}
.dk.pri{background:var(--gold);border-color:#e9b93c;color:#4a3200}
.dk.pri:hover:not(:disabled){background:#ffd978}
.dk:disabled{opacity:.4;cursor:not-allowed}
.infobtn{position:relative;flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--brand-light);background:#fff;color:var(--brand);font:italic 700 14px Georgia,'Times New Roman',serif;display:flex;align-items:center;justify-content:center;cursor:help;outline:none}
.infobtn:hover,.infobtn:focus{background:var(--brand);color:#fff;border-color:var(--brand)}
.infobtn .tip{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%) translateY(4px);width:min(300px,80vw);background:var(--brand-dark);color:#fff;font:400 13.5px/1.55 'Roboto',sans-serif;padding:10px 13px;border-radius:11px;box-shadow:var(--sh-3);opacity:0;visibility:hidden;transition:opacity .18s,transform .18s;pointer-events:none;text-align:left;z-index:10}
.infobtn .tip::after{content:'';position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--brand-dark)}
.infobtn:hover .tip,.infobtn:focus .tip{opacity:1;visibility:visible;transform:translateX(-50%)}
.verdict{pointer-events:none;position:absolute;z-index:6;top:12px;left:calc((100% - min(460px,42%) - 60px)/2 + 28px);transform:translateX(-50%);padding:8px 16px;border-radius:99px;font-size:15px;font-weight:700;box-shadow:var(--sh-3);white-space:normal;text-align:center;width:max-content;max-width:calc(100% - min(460px,42%) - 190px);display:none;animation:fade .3s ease}
.verdict.ok{display:block;background:#eef7ea;color:#2f5a24;border:2px solid var(--ok)}
.verdict.no{display:block;background:#fbeae4;color:#a54527;border:2px solid var(--bad)}
.verdict.info{display:block;background:#fff6dd;color:#6b4d13;border:2px solid var(--gold)}
.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-20px);z-index:40;background:var(--brand-dark);color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;box-shadow:var(--sh-3);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

.steps{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;overflow-y:hidden;border-top:1px solid var(--line);scrollbar-width:none;flex:0 0 auto}
.steps::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:7px 13px 7px 8px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap}
.step b{width:20px;height:20px;border-radius:99px;background:var(--brand-soft);color:var(--brand-dark);font-size:11px;display:flex;align-items:center;justify-content:center}
.step[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;animation:stepJump .28s ease}
@keyframes stepJump{0%{transform:scale(.96)}70%{transform:scale(1.035)}100%{transform:scale(1)}}
.step[aria-pressed="true"] b{background:rgba(255,255,255,.25);color:#fff}
.step.done:not([aria-pressed="true"]) b{background:var(--brand);color:#fff}

.intro-loader{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;background:radial-gradient(80% 70% at 50% 40%,#2f827d 0,#195856 58%,#0b2a29 100%);transition:opacity .45s}
.intro-loader.gone{opacity:0;pointer-events:none}
.intro-inner{position:relative;z-index:2;width:min(760px,92vw);display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff}
.intro-kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#d6e78c}
.intro-inner h1{font-size:clamp(30px,4.6vw,50px);margin:10px 0 12px;line-height:1.14;font-weight:800;letter-spacing:-.02em;text-shadow:0 4px 18px rgba(0,0,0,.4)}
.intro-sub{max-width:680px;margin:0 auto 30px;font-size:14.5px;line-height:1.65;color:rgba(255,255,255,.93)}
.intro-progress{width:min(410px,72vw);height:3px;margin:0 auto 14px;border-radius:99px;background:rgba(255,255,255,.36);overflow:hidden}
.intro-progress span{display:block;height:100%;width:8%;background:#d8ff64;box-shadow:0 0 12px rgba(216,255,100,.5);transition:width .3s linear}
#introStatus{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.ready-dot{width:8px;height:8px;border-radius:99px;background:#d8ff64;display:inline-block;margin-right:7px;box-shadow:0 0 10px rgba(216,255,100,.65)}
.intro-explore{margin:20px auto 0;min-width:210px;padding:12px 20px;border-radius:10px;border:1px solid rgba(255,255,255,.34);cursor:pointer;background:rgba(25,88,86,.82);color:#fff;font-weight:700;font-size:14px;opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .28s,transform .28s,background .2s}
.intro-loader.ready .intro-explore{opacity:1;transform:none;pointer-events:auto}
.intro-explore:hover{background:rgba(47,130,125,.96)}
.intro-credit{margin-top:30px;color:rgba(255,255,255,.86);font-size:12px}

/* SVG: đồ vật kéo được, hiệu ứng */
.drag{cursor:grab}
.drag:active{cursor:grabbing}
.drag.lift{filter:drop-shadow(0 10px 10px rgba(0,0,0,.28))}
.bob{animation:bob 1.3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.pulse{animation:svgPulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes svgPulse{50%{opacity:.45}}
.float-up{animation:floatUp 1.1s ease-out forwards}
@keyframes floatUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-36px)}}
/* bước dạng trang (không có khung 2D): bảng bài học chiếm cả khung */
.stage.full .view,.stage.full .dock,.stage.full .verdict{display:none!important}
.stage.full .lesson{left:60px;right:60px;width:auto;background:transparent;box-shadow:none;backdrop-filter:none}
.stage.full .sidebody{background:transparent;display:flex;flex-direction:column}
.stage.full .sec{flex:1 0 auto;display:flex;flex-direction:column}
.stage.full .sec>h2{color:#fff;font-size:28px;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.25)}


@media (max-width:900px){
  .main{padding:10px}
  .titles h1{font-size:15px}
  .stage-nav{width:34px;height:34px;font-size:14px;top:25%}
  .view{left:46px;right:46px;top:44px;bottom:calc(50% + 54px)}
  .lesson{left:8px;right:8px;top:auto;bottom:8px;width:auto;height:calc(50% - 8px)}
  .stage-tools{left:8px;top:8px}
  .ghost span{display:none}
  .dock{left:8px;right:8px;bottom:calc(50% + 4px);flex-wrap:wrap;justify-content:center;overflow:visible}
  .dock .grp{flex:0 0 auto;flex-wrap:wrap;padding:4px 6px;gap:4px;border-radius:12px}
  .dock .gl{display:none}
  .infobtn .tip{left:auto;right:-8px;transform:translateY(4px)}
  .infobtn:hover .tip,.infobtn:focus .tip{transform:none}
  .infobtn .tip::after{left:auto;right:14px}
  .dk{padding:5px 9px;font-size:12px;min-height:38px}
  .verdict{left:50%;top:8px;font-size:13px;max-width:calc(100% - 170px)}
  .sec h2{font-size:19px}

<script>
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];

/* =====================================================================
   1. Thư viện hình 2D (SVG): ca có vạch chia, chai, cốc, kéo – thả, rót nước
   ===================================================================== */
const NS='http://www.w3.org/2000/svg';
const view=$('#view');
let SVG=null;
function el(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function stageSVG(vb='0 0 640 460'){
  view.innerHTML=`<svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet"></svg>`;SVG=view.firstChild;return SVG;}
function svgPt(e){const p=SVG.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(SVG.getScreenCTM().inverse());}
function localPt(node,x,y){const p=SVG.createSVGPoint();p.x=x;p.y=y;return p.matrixTransform(SVG.getScreenCTM().inverse().multiply(node.getScreenCTM()));}
/* số có dấu cách hàng nghìn: 1000 → "1 000" */
const nf=v=>String(v).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const ml=v=>v>=1000&&v%1000===0?`${v/1000} l`:`${nf(v)} ml`;

let epoch=0;
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
function tween(dur,fn){const my=epoch;return new Promise(res=>{const t0=performance.now();
  const f=now=>{if(my!==epoch)return res(false);const lin=Math.min(1,(now-t0)/dur);fn(ease(lin),lin);lin<1?requestAnimationFrame(f):res(true);};requestAnimationFrame(f);});}
const wait=ms=>{const my=epoch;return new Promise(r=>setTimeout(()=>r(my===epoch),ms));};
let busy=false;
async function run(fn){if(busy)return;busy=true;try{await fn();}finally{busy=false;}}

/* nền: tường sáng + mặt bàn gỗ */
function scene(y0=392){
  const d=el('defs',{},SVG);
  d.innerHTML=`<linearGradient id="gWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7fcfb"/><stop offset="1" stop-color="#dcefe9"/></linearGradient>
  <linearGradient id="gTable" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0d3a3"/><stop offset="1" stop-color="#d9b07a"/></linearGradient>
  <linearGradient id="gGlass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".7" stop-color="#eaf6fb" stop-opacity=".35"/><stop offset="1" stop-color="#cfe6ef" stop-opacity=".55"/></linearGradient>`;
  el('rect',{x:0,y:0,width:640,height:460,rx:26,fill:'url(#gWall)'},SVG);
  /* mặt bàn kéo dài xuống sau thanh nút, đáy bo tròn giống góc trên (rx 26) */
  const tb=el('path',{fill:'url(#gTable)'},SVG),svg=SVG;
  const fit=()=>{if(!svg.isConnected)return removeEventListener('resize',fit);const k=svg.getScreenCTM()?.a||1,B=460+Math.min(140,58/k);
    tb.setAttribute('d',`M0,${y0} H640 V${B-26} A26,26 0 0 1 614,${B} H26 A26,26 0 0 1 0,${B-26} Z`);};
  fit();requestAnimationFrame(fit);addEventListener('resize',fit);
  el('rect',{x:0,y:y0,width:640,height:6,fill:'#c99b62',opacity:.7},SVG);
  const cl=el('clipPath',{id:'cRound'},d);el('rect',{x:0,y:0,width:640,height:460,rx:26},cl);
}

/* đường viền ca có mỏ rót liền khối (thân thẳng, bo đáy). Trả về [viền, vành] */
function jugOutline(x,y,w,h,r,spout=true){
  if(!spout)return[`M${x},${y} L${x+w},${y} L${x+w},${y+h-r} Q${x+w},${y+h} ${x+w-r},${y+h} L${x+r},${y+h} Q${x},${y+h} ${x},${y+h-r} Z`,`M${x-3},${y} L${x+w+3},${y}`];
  const T=`${x-w*.14},${y-h*.045}`,C2=`${x+w*.02},${y-h*.004}`,R=`${x+w*.2},${y}`,W=`${x},${y+h*.1}`,C1=`${x-w*.02},${y+h*.035}`;
  return[`M${T} Q${C2} ${R} L${x+w},${y} L${x+w},${y+h-r} Q${x+w},${y+h} ${x+w-r},${y+h} L${x+r},${y+h} Q${x},${y+h} ${x},${y+h-r} L${W} Q${C1} ${T} Z`,
         `M${T} Q${C2} ${R} L${x+w+3},${y}`];
}
/* Ca / cốc có vạch chia. x,y: góc trên-trái thân ca; cap: dung tích (ml) ở vạch trên cùng */
let JUGID=0;
function makeJug(parent,o){
  const {x,y,w,h,cap}=o, id='jug'+(++JUGID);
  const minor=o.minor||0, labels=o.labels||[], r=Math.min(18,w*.14);
  const top=y+h*(o.headroom??.12), bot=y+h-4, k=(bot-top)/cap;
  const g=el('g',{class:'jug'},parent);
  const [body,rim]=jugOutline(x,y,w,h,r,o.spout!==false);
  const cp=el('clipPath',{id:id+'c'},g);el('path',{d:body},cp);
  if(o.handle!==false)el('path',{d:`M${x+w-2},${y+h*.16} C${x+w+w*.34},${y+h*.14} ${x+w+w*.34},${y+h*.72} ${x+w-2},${y+h*.7}`,fill:'none',stroke:'#a9cdd8',['stroke-width']:Math.max(6,w*.07),['stroke-linecap']:'round'},g);
  el('path',{d:body,fill:'#ffffff',opacity:.6},g);
  const wg=el('g',{['clip-path']:`url(#${id}c)`},g);
  const lay=[];
  const surf=el('rect',{x,width:w,height:4,fill:'#fff',opacity:.55},wg);
  // vạch chia
  const tg=el('g',{},g);const fs=o.fs||Math.max(11,Math.min(16,h/16));
  if(minor)for(let v=minor;v<=cap+0.01;v+=minor){
    const yy=bot-v*k, big=labels.includes(v)||(o.majorEvery&&v%o.majorEvery===0);
    el('line',{x1:x+3,x2:x+3+(big?w*.24:w*.13),y1:yy,y2:yy,stroke:'#22495a',['stroke-width']:big?2.4:1.8,['data-v']:v},tg);
    if(labels.includes(v)){const t=el('text',{x:x+6+w*.26,y:yy+fs*.35,['font-size']:fs,['font-weight']:600,fill:'#22495a'},tg);t.textContent=o.fmt?o.fmt(v):ml(v);}
  }
  el('path',{d:body,fill:'url(#gGlass)',stroke:'#8fb7c4',['stroke-width']:3,['stroke-linejoin']:'round'},g);
  el('rect',{x:x+w*.8,y:y+h*.1,width:w*.06,height:h*.75,rx:3,fill:'#fff',opacity:.55},g);
  el('path',{d:rim,fill:'none',stroke:'#8fb7c4',['stroke-width']:5,['stroke-linecap']:'round',['stroke-linejoin']:'round'},g);
  if(o.name){const t=el('text',{x:x+w/2,y:y+h+(o.nameDy||26),['text-anchor']:'middle',['font-size']:o.nameFs||18,['font-weight']:700,fill:o.nameColor||'#0f3f3d'},g);t.textContent=o.name;}
  const J={g,x,y,w,h,cap,k,top,bot,layers:lay,
    total(){return lay.reduce((s,l)=>s+l.ml,0);},
    addLayer(color){const rect=el('rect',{x,width:w,y:bot,height:0,fill:color},wg);wg.insertBefore(rect,surf);lay.push({ml:0,color,rect});return lay.at(-1);},
    render(){let acc=0;lay.forEach(l=>{const y1=bot-(acc+l.ml)*k;l.rect.setAttribute('y',y1);l.rect.setAttribute('height',l.ml*k+(acc===0?6:0.6));acc+=l.ml;});
      const ys=bot-acc*k;surf.setAttribute('y',ys-1);surf.setAttribute('opacity',acc>0?.55:0);},
    set(v){if(!lay.length)J.addLayer(o.color||'#5ab4e8');const prev=lay.slice(0,-1).reduce((s,l)=>s+l.ml,0);lay.at(-1).ml=Math.max(0,v-prev);J.render();},
    to(v,dur=900){const a=J.total();return tween(dur,(e)=>J.set(a+(v-a)*e));},
    clear(){lay.splice(0).forEach(l=>l.rect.remove());J.render();},
    surfaceY(){return bot-J.total()*k;},
    yOf(v){return bot-v*k;},
    hit(p,pad=46){return p.x>x-pad&&p.x<x+w+pad&&p.y>y-pad*2.2&&p.y<y+h+pad*.4;},
    tick(v){return tg.querySelector(`[data-v="${v}"]`);}
  };
  if(o.ml){J.set(o.ml);}else J.render();

/* kéo – thả (chuột và cảm ứng). Chạm nhẹ = onTap. onDrop(pt) trả về true nếu thả đúng chỗ */
function draggable(n,{canDrag=()=>true,onDrop,onTap}){
  n.classList.add('drag');let st=null;
  n.addEventListener('pointerdown',e=>{if(!canDrag()||busy)return;e.preventDefault();n.parentNode.appendChild(n);n.setPointerCapture(e.pointerId);
    st={p0:svgPt(e),x:n._x,y:n._y,moved:false};n.classList.add('lift');});
  n.addEventListener('pointermove',e=>{if(!st)return;const p=svgPt(e),dx=p.x-st.p0.x,dy=p.y-st.p0.y;
    if(Math.hypot(dx,dy)>6)st.moved=true;if(st.moved)setPos(n,st.x+dx,st.y+dy,0);});
  const up=e=>{if(!st)return;const s=st;st=null;n.classList.remove('lift');
    if(!s.moved){onTap&&onTap();return;}

  return{ok:()=>{t(523,0,.14,'sine',.11);t(659,.1,.14,'sine',.11);t(784,.2,.26,'sine',.11);},

/* danh sách kéo: 3 dòng hiển thị, dòng giữa là lựa chọn; bấm Kiểm tra */
function wheel(host,{q,opts,ok,start=0,okMsg='Đúng rồi!',noMsg='Chưa đúng, thử lại nhé!',onOk}){
  const d=document.createElement('div');d.className='wheelq';
  d.innerHTML=`<p class="wq">${q}</p><div class="wrow"><div class="wheel"><div class="wl"><div class="wpad"></div>${opts.map((o,i)=>`<div class="wi" data-i="${i}">${o}</div>`).join('')}<div class="wpad"></div></div></div>
    <button class="qbtn" type="button">Kiểm tra</button></div><div class="fb"></div>`;
  host.appendChild(d);
  const wl=$('.wl',d),wh=$('.wheel',d),btn=$('.qbtn',d),fb=$('.fb',d),H=52;let done=false;
  const idx=()=>Math.max(0,Math.min(opts.length-1,Math.round(wl.scrollTop/H)));
  const mark=()=>{const i=idx();$$('.wi',d).forEach(e=>e.classList.toggle('on',+e.dataset.i===i));};
  wl.addEventListener('scroll',()=>{mark();if(!done){wh.classList.remove('no');fb.className='fb';}});
  /* kéo bằng chuột trên máy tính; chạm nhẹ vào dòng = chọn dòng đó */
  let dr=null;
  wl.addEventListener('pointerdown',e=>{if(done)return;dr={y:e.clientY,t:wl.scrollTop,m:false,mouse:e.pointerType==='mouse'};if(dr.mouse){wl.style.scrollSnapType='none';e.preventDefault();}});
  addEventListener('pointermove',e=>{if(!dr)return;if(Math.abs(e.clientY-dr.y)>5)dr.m=true;if(dr.mouse)wl.scrollTop=dr.t-(e.clientY-dr.y);});
  addEventListener('pointerup',e=>{if(!dr)return;const s=dr;dr=null;wl.style.scrollSnapType='';
    let i=idx();if(!s.m){const it=e.target.closest&&e.target.closest('.wi');if(it&&d.contains(it))i=+it.dataset.i;}
    wl.scrollTo({top:i*H,behavior:'smooth'});});
  setTimeout(()=>{wl.scrollTop=start*H;mark();},0);
  btn.onclick=()=>{if(done)return;const i=idx();
    if(i===ok){done=true;wh.classList.add('ok');btn.disabled=true;wl.style.overflowY='hidden';fb.className='fb show ok';fb.innerHTML='✔ '+okMsg;sfx.ok();onOk&&onOk();}
    else{wh.classList.remove('no');void wh.offsetWidth;wh.classList.add('no');fb.className='fb show no';fb.innerHTML='✘ '+noMsg;sfx.no();}};

  return d;
}

  const hint=hintArrow(505,176,'Kéo chai vào ca');
  let done=false;
  const go=()=>run(async()=>{
    if(done)return;done=true;hint.remove();verdict(null);
    if(!await pourInto(b,jug,500,{dur:2600,onSrc:k=>b.set(500*(1-k))}))return;
    taskDone();const t=jug.tick(500);t.setAttribute('stroke','#e9a800');t.setAttribute('stroke-width',5);t.classList.add('pulse');
    const V=[100,200,300,400,500,600,700,800,900,1000];
    wheel($('#q'),{q:'Chai có bao nhiêu nước?',opts:V.map(v=>nf(v)+' ml'),ok:4,start:1,
      okMsg:'Đúng rồi!',noMsg:'Nhìn lại vạch nước nhé!',
      onOk(){verdict('ok','✔ 500 ml');b.setTag('500 ml');speak('1.2',1);
        $('#r').innerHTML=kcard('Ghi nhớ',`<p class="kbig">500 mi-li-lít</p><p class="kmid">Mi-li-lít viết tắt là <b>ml</b></p>`);
        complete(0);}});
  });
  draggable(b.g,{canDrag:()=>!done,onTap:go,onDrop:pt=>{if(jug.hit(pt)){go();return true;}toast('Thả vào ca nhé!');return false;}});
  p.innerHTML=`${head('','Rót nước')}
   <p class="say"><span>Rót hết nước trong chai vào ca.</span></p>
   <div id="q"></div><div id="r"></div>`;
  dock(`<div class="grp"><button class="dk" id="bRe" type="button">↺ Làm lại</button></div>`,
    'Kéo chai thả vào ca (hoặc chạm vào chai).');
  $('#bRe').onclick=()=>goTo(cur);
 }},

/* ---------------- Đổ từng cốc 100 ml, đếm vạch ---------------- */
{label:'Đếm vạch',
 say:'2.1',
 mount(p){
  stageSVG();scene();
  const jug=makeJug(SVG,JUG1L);
  const cup=makeCup(SVG,{cap:100,ml:100,label:'100 ml'});home(cup.g,510,352);
  const rd=label(250,58,'0 ml',{fs:22});
  const hint=hintArrow(510,272,'Kéo cốc vào ca');
  let n=0;
  const prog=()=>`<div class="prog" aria-label="Số cốc đã đổ">${Array.from({length:10},(_,i)=>`<span class="${i<n?'ok':''}"></span>`).join('')}</div>`;
  const go=()=>run(async()=>{
    if(n>=10)return;hint.remove();
    if(!await pourInto(cup,jug,100,{dur:650,onSrc:k=>cup.set(100*(1-k))}))return;
    n++;const v=n*100,t=jug.tick(v);
    t.setAttribute('stroke','#e9a800');t.setAttribute('stroke-width',4);
    floatText(jug.x+jug.w+44,jug.yOf(v)+6,'+100 ml','#e07a00',17);sfx.pop();
    rd.set(ml(v));
    $('#cnt').innerHTML=`${n} cốc${prog()}`;
    if(n<10){await wait(200);cup.set(100);return;}
    taskDone();cup.g.remove();rd.set('1 000 ml = 1 l');verdict('ok','✔ Đầy 1 l');sfx.win();
    numWheel($('#q1'),{q:'Mỗi vạch là bao nhiêu ml?',vals:[10,20,50,100,200,500,1000],ans:100,
      okMsg:'Đúng rồi!',noMsg:'Mỗi cốc 100 ml dâng 1 vạch!',
      onOk(){numWheel($('#q2'),{q:'1 l = ? ml',vals:[10,50,100,500,1000],ans:1000,
        okMsg:'Đúng rồi!',noMsg:'Đếm lại: 10 cốc 100 ml!',
        onOk(){speak('2.2',1);$('#r').innerHTML=kcard('Ghi nhớ',`<p class="kmid">1 vạch = <b>100 ml</b></p><p class="kbig">1 l = 1 000 ml</p>`);complete(1);}});}});
  });
  draggable(cup.g,{canDrag:()=>n<10,onTap:go,onDrop:pt=>{if(jug.hit(pt)){go();return true;}toast('Thả vào ca nhé!');return false;}});
  p.innerHTML=`${head('','Đếm vạch')}
   <p class="say"><span>Đổ cốc <b>100 ml</b> vào ca đến khi đầy <b>1 l</b>.</span></p>
   <div class="say hint" id="cnt">0 cốc${prog()}</div>
   <div id="q1"></div><div id="q2"></div><div id="r"></div>`;
  dock(`<div class="grp"><button class="dk" id="bRe" type="button">↺ Làm lại</button></div>`,
    'Kéo cốc thả vào ca (hoặc chạm vào cốc).');
  $('#bRe').onclick=()=>goTo(cur);
 }},

/* ---------------- Trò chơi đọc vạch ---------------- */
{label:'Đọc vạch',
 say:'3.1',
 mount(p){
  stageSVG();scene();
  const jug=makeJug(SVG,JUG1L);jug.set(0);
  const qs=shuffle([200,300,400,600,700,800,900]).slice(0,4).concat([1000]).sort(()=>Math.random()-.5);
  let i=0,score=0,miss=false;
  const star={set(){}}; // bỏ bảng điểm sao trên khung hình
  const dots=()=>qs.map((_,k)=>`<span class="${k<i?'ok':k===i?'cur':''}"></span>`).join('');
  async function round(){
    miss=false;$('#prog').innerHTML=dots();$('#round').innerHTML='';
    const v=qs[i];await jug.to(v,900);
    const opts=shuffle([v,...shuffle([v-200,v-100,v+100,v+200].filter(x=>x>=100&&x<=1000)).slice(0,2)]);
    const o=opts.map(x=>x===1000?'1 000 ml':nf(x)+' ml');
    numWheel($('#round'),{q:'Ca có bao nhiêu nước?',ans:v,
      noMsg:'Đếm lại vạch nhé!',
      onOk:async()=>{if(!miss){score++;star.set('⭐ '+score);}floatText(jug.x+jug.w+50,jug.surfaceY()+6,'✔ '+(v===1000?'1 000 ml':nf(v)+' ml'),'#2f8a3a',18);
        i++;$('#prog').innerHTML=dots();
        if(i<qs.length){if(await wait(1100))round();}
        else finish();}});
    $$('#round .qbtn').forEach(b=>b.addEventListener('click',()=>{if($('#round .wheel.no'))miss=true;}));
  }
  function finish(){
    taskDone();sfx.win();verdict('ok','🏆 Giỏi lắm!');speak('3.2',1);
    $('#r').innerHTML=kcard('Ghi nhớ',`<p class="kmid">Mi-li-lít: <b>ml</b></p><p class="kbig">1 l = 1 000 ml</p>`);
    complete(2);
  }
  p.innerHTML=`${head('','Đọc vạch')}
   <p class="say"><span>Đếm vạch, chọn số đúng.</span></p><div class="prog" id="prog"></div>
   <div id="round"></div><div id="r"></div>`;
  dock(`<div class="grp"><button class="dk" id="bRe" type="button">↺ Chơi lại</button></div>`,
    'Mỗi vạch là 100 ml.');
  $('#bRe').onclick=()=>goTo(cur);
  round();
 }},
];


/* =====================================================================
   4. Điều phối bước
   ===================================================================== */
let cur=0;const finished=new Set();
function renderBar(){
  stepsBar.innerHTML=STEPS.map((s,i)=>`<button class="step ${finished.has(i)?'done':''}" type="button" data-i="${i}" aria-pressed="${i===cur}"><b>${finished.has(i)?'✓':i+1}</b><span>${s.label}</span></button>`).join('');
  $('#btnPrev').disabled=cur<=0;
  $('#btnNext').disabled=cur>=STEPS.length-1;
  $('#btnNext').classList.toggle('nudge',finished.has(cur)&&cur<STEPS.length-1);
  stepsBar.children[cur]?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
}
stepsBar.onclick=e=>{const b=e.target.closest('.step');if(b)goTo(+b.dataset.i);};
$('#btnPrev').onclick=()=>goTo(cur-1);
$('#btnNext').onclick=()=>goTo(cur+1);
window.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')goTo(cur+1);else if(e.key==='ArrowLeft')goTo(cur-1);});

function complete(i){
  finished.add(i);
  renderBar();
  if(i===cur&&i<STEPS.length-1&&!$('.next-wrap.go')){
    const w=document.createElement('div');w.className='next-wrap go';
    w.innerHTML=`<button class="qbtn next-btn" type="button">Tiếp tục: ${STEPS[i+1].label} ▶</button>`;
    w.firstChild.onclick=()=>goTo(i+1);
    $('.sec',sidebody).appendChild(w);
    setTimeout(()=>w.scrollIntoView({behavior:'smooth',block:'nearest'}),150);
  }
}
function resetScene(){epoch++;busy=false;verdict(null);dock('');view.innerHTML='';SVG=null;window.onStepLeave&&window.onStepLeave();window.onStepLeave=null;}
function goTo(n){
  n=Math.max(0,Math.min(STEPS.length-1,n));
  cur=n;resetScene();$('#stage').classList.toggle('full',!!STEPS[n].full);
  stopVO();
  sidebody.innerHTML='<div class="sec"></div>';sidebody.scrollTop=0;
  STEPS[n].mount($('.sec',sidebody));
  renderBar();
  if(finished.has(n))complete(n);
  speak(STEPS[n].say);
}

/* =====================================================================
   5. Màn hình mở đầu
   ===================================================================== */
setTimeout(()=>{clearInterval(window.__introTick);$('#introBar').style.width='100%';
  $('#introStatus').innerHTML='<span class="ready-dot"></span>Đã sẵn sàng!';$('#introLoader').classList.add('ready');},700);
$('#btnExplore').onclick=()=>{
  $('#introLoader').classList.add('gone');setTimeout(()=>$('#introLoader').style.display='none',500);
  goTo(+(new URLSearchParams(location.search).get('step')||1)-1);
};
window.__lesson={goTo,STEPS};
