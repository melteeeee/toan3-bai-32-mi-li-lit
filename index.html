<style>
/* ============================================================
   DESIGN SYSTEM v1 — theo template "Cảnh 3D - Thụ phấn ở hoa"
   ============================================================ */
:root{
  --brand:#195856; --brand-dark:#0f3f3d; --brand-light:#2f827d; --brand-soft:#e6f0ee;
  --ink:#10302d; --muted:#5f8b89; --line:#dbe8e5; --bg:#195658; --gold:#a8814a;
  --stage-mid:#f1f9f7; --stage-bottom:#dcebe7;
  --r:16px; --r-sm:11px;
  --sh-1:0 1px 2px rgba(13,42,40,.05);
  --sh-2:0 2px 6px rgba(13,42,40,.06),0 18px 34px -22px rgba(13,42,40,.45);
  --sh-3:0 10px 30px -12px rgba(13,42,40,.32);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:'Roboto',system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:15px;line-height:1.5;color:var(--ink);background:#195658;
  overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
}
button{font-family:inherit}
.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:#195658}

/* topbar */
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);box-shadow:var(--sh-1);z-index:20;flex:0 0 auto}
.logoclip{height:27px;display:flex;align-items:center;flex:0 0 auto}
.logoclip .logo{height:27px;display:block}
.titles{flex:1;min-width:0}
.badge{display:inline-block;max-width:100%;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--brand);background:var(--brand-soft);border-radius:99px;padding:2px 9px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titles h1{margin:0;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:18px}
.tb-right{display:flex;gap:8px;flex:0 0 auto}
.tb-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--brand-dark);font-size:17px;transition:background .15s,border-color .15s}
.tb-btn:hover{background:var(--brand-soft);border-color:var(--brand-light)}
.tb-btn svg{width:18px;height:18px}
.tb-btn[hidden]{display:none}

/* khung chính */
.main{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px;overflow:hidden;background:#195658}
.stagecol{display:flex;flex-direction:column;flex:1;min-height:0;min-width:0}
.frame{background:#fff;border-radius:var(--r);box-shadow:var(--sh-2);display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.stage{position:relative;flex:1;min-height:0;background:#195658;overflow:hidden}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#195658}
.vignette{position:absolute;inset:0;z-index:1;pointer-events:none;box-shadow:inset 0 0 90px rgba(15,63,61,.10)}

/* thanh các phần (pill, như .steps của template) */
.steps{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);flex:0 0 auto}
.steps-scroll{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex:1;min-width:0}
.steps-scroll::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:7px 13px 7px 8px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.step b{width:20px;height:20px;border-radius:99px;background:var(--brand-soft);color:var(--brand-dark);font-size:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.step:hover{border-color:var(--brand-light)}
.step[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.step[aria-pressed="true"] b{background:rgba(255,255,255,.25);color:#fff}
.step.done b{background:var(--brand);color:#fff}
.nav-btn{flex:0 0 auto;width:34px;height:34px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--brand-dark);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .15s,opacity .15s}
.nav-btn:hover{background:var(--brand-soft)}
.nav-btn[disabled]{opacity:.3;pointer-events:none}


/* nút trước / sau nổi trên khung (như template) */
.stage-nav{position:absolute;top:50%;z-index:30;transform:translateY(-50%);width:38px;height:38px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.88);backdrop-filter:blur(8px) saturate(1.3);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--brand-dark);box-shadow:var(--sh-1);font-size:16px;transition:opacity .15s,background .15s}
.stage-nav:hover{background:var(--brand-soft)}
.stage-nav.prev{left:12px}.stage-nav.next{right:12px}
.stage-nav[disabled]{opacity:.3;pointer-events:none}
@media (max-width:920px){.stage-nav{width:34px;height:34px;font-size:14px}}
.step.locked{opacity:.5;cursor:not-allowed}
.step.locked b{background:var(--line)}
.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%) translateY(10px);z-index:40;background:rgba(15,63,61,.94);color:#fff;border-radius:99px;padding:9px 16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* intro (như template các phần) */
.intro-loader{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;background:radial-gradient(80% 70% at 50% 40%,#2f827d 0,#195856 58%,#0b2a29 100%);transition:opacity .45s}
.intro-loader.gone{opacity:0;pointer-events:none}
.intro-inner{position:relative;z-index:2;width:min(760px,92vw);display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff}
.intro-kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#d6e78c}
.intro-inner h1{font-size:clamp(30px,4.6vw,50px);margin:10px 0 12px;line-height:1.14;font-weight:800;letter-spacing:-.02em;text-shadow:0 4px 18px rgba(0,0,0,.4)}
.intro-sub{max-width:680px;margin:0 auto 30px;font-size:14.5px;line-height:1.65;color:rgba(255,255,255,.93)}
.intro-progress{width:min(410px,72vw);height:3px;margin:0 auto 14px;border-radius:99px;background:rgba(255,255,255,.36);overflow:hidden}
.intro-progress span{display:block;height:100%;width:8%;background:#d8ff64;box-shadow:0 0 12px rgba(216,255,100,.5);transition:width .3s linear}
#introStatus{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.ready-dot{width:8px;height:8px;border-radius:99px;background:#d8ff64;display:inline-block;margin-right:7px;box-shadow:0 0 10px rgba(216,255,100,.65)}
.intro-explore{margin:20px auto 0;min-width:210px;padding:12px 20px;border-radius:10px;border:1px solid rgba(255,255,255,.34);cursor:pointer;background:rgba(25,88,86,.82);color:#fff;font-weight:700;font-size:14px;opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .28s,transform .28s,background .2s}
.intro-loader.ready .intro-explore{opacity:1;transform:none;pointer-events:auto}
.intro-explore:hover{background:rgba(47,130,125,.96)}
.intro-credit{margin-top:30px;color:rgba(255,255,255,.86);font-size:12px}

@media (max-width:920px){.main{padding:10px}}
@media (max-width:620px){
  .badge{display:none}
  .titles h1{font-size:15px}
}
@media (max-height:480px){
  .topbar{padding:4px 12px}.logoclip,.logoclip .logo{height:22px}.badge{display:none}.titles h1{font-size:15px}
  .tb-btn{width:32px;height:32px}.main{padding:6px}.steps{padding:6px 10px}.step{padding:4px 11px 4px 6px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>

ction class=\"pane\" id=\"pane1\" aria-label=\"Hỏi đáp\" hidden>\n        <div class=\"qa\">\n          <h2 style=\"margin:0;font-size:clamp(20px,3vw,26px);font-weight:700;color:var(--brand-dark)\">Vạch chia trên cốc để làm gì?<\/h2>\n          <div class=\"qimg\" id=\"qimg\"><\/div>\n          <div class=\"cards\" id=\"cards\"><\/div>\n          <div class=\"other\">\n            <label for=\"own\">Ý kiến khác của em<\/label>\n            <textarea id=\"own\" maxlength=\"200\" placeholder=\"Em nghĩ…\"><\/textarea>\n          <\/div>\n          <div class=\"actions\"><button class=\"btn\" id=\"btnSend\" type=\"button\" disabled>Gửi ý kiến<\/button><\/div>\n          <div class=\"fb\" id=\"fb\" hidden><\/div>\n        <\/div>\n      <\/section>\n\n      <div class=\"vignette\" aria-hidden=\"true\"><\/div>\n      <button class=\"stage-nav prev\" id=\"btnPrev\" type=\"button\" aria-label=\"Bước trước\">◀<\/button>\n      <button class=\"stage-nav next\" id=\"btnNext\" type=\"button\" aria-label=\"Bước sau\">▶<\/button>\n      <div class=\"toast\" id=\"toast\" role=\"status\"><\/div>\n    <\/div>\n    <div class=\"steps\" id=\"steps\" role=\"tablist\" aria-label=\"Các bước khởi động\"><\/div>\n  <\/div><\/div>\n<\/div>\n\n<script>\nconst $=id=>document.getElementById(id);\nlet muted=false;\n\n/* ===== âm thanh ===== */\nconst audio=(()=>{let ctx=null;\n  const ac=()=>{try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}return ctx};\n  const tone=(f,t,d,type,v)=>{const c=ac();if(!c||muted)return;const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;\n    const s=c.currentTime+t;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v||.08,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);\n    o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d+.03)};\n  return{click:()=>tone(660,0,.08,'triangle',.07),ok:()=>{tone(523,0,.13,'sine',.11);tone(659,.1,.13,'sine',.11);tone(784,.2,.25,'sine',.11)}}})();\nfunction toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200)}\n\n/* ---- thuyết minh: mã → link mp3 (xem thuyet-minh.json); để trống thì chỉ hiện phụ đề ---- */\nconst VO={\n  '1.1':'https://assets.yoolife.com.vn/yootek/1794903763101-8347.mp3',\n  '1.2':'https://assets.yoolife.com.vn/yootek/1794903766959-1046.mp3',\n  '1.3':'https://assets.yoolife.com.vn/yootek/1794903770810-3571.mp3',\n  '1.4':'https://assets.yoolife.com.vn/yootek/1794903774667-3464.mp3',\n  '1.5':'https://assets.yoolife.com.vn/yootek/1794903778441-4621.mp3',\n  '1.6':'https://assets.yoolife.com.vn/yootek/1794903782463-5224.mp3',\n  '1.7':'https://assets.yoolife.com.vn/yootek/1794903786313-5616.mp3',\n  '1.8':'https://assets.yoolife.com.vn/yootek/1794903790380-2968.mp3',\n  '1.9':'https://assets.yoolife.com.vn/yootek/1794903794416-2599.mp3',\n  '1.10':'https://assets.yoolife.com.vn/yootek/1794903798233-7399.mp3',\n  '1.11':'https://assets.yoolife.com.vn/yootek/1794903802078-4100.mp3',\n  '1.12':'https://assets.yoolife.com.vn/yootek/1794903806020-6667.mp3',\n  '2.1':'https://assets.yoolife.com.vn/yootek/1794903810297-1872.mp3',\n  '2.2':'https://assets.yoolife.com.vn/yootek/1794903814442-4507.mp3'\n};\nconst voice=new Audio();\nfunction stopVoice(){voice.pause();}\nfunction unlockVoice(){if(voice.src||!VO['1.1'])return;voice.muted=true;voice.src=VO['1.1'];voice.play().catch(()=>{});}\nfunction playVoice(id){stopVoice();if(muted||!VO[id])return;voice.muted=false;voice.src=VO[id];voice.currentTime=0;voice.play().catch(()=>{});}\n\n/* ===== các bước ===== */\nconst STEPS=['Xem video','Hỏi đáp'];\nlet cur=0,unlocked=STEPS.length-1,doneSet=new Set();\nconst stepsEl=$('steps');\nfunction renderSteps(){\n  stepsEl.innerHTML='';\n  STEPS.forEach((n,i)=>{\n    const b=document.createElement('button');b.type='button';b.className='step'+(doneSet.has(i)?' done':'')+(i>unlocked?' is-locked':'');\n    b.setAttribute('role','tab');b.setAttribute('aria-pressed',i===cur);\n    b.innerHTML='<b>'+(doneSet.has(i)?'✓':i+1)+'<\/b>'+n;b.onclick=()=>go(i);stepsEl.appendChild(b)});\n}\nfunction go(i){\n  if(i>unlocked)return;cur=i;\n  $('pane1').hidden=i!==1;\n  $('btnPrev').disabled=i<=0;$('btnNext').disabled=i>=STEPS.length-1;\n  stopVoice();\n  if(i!==0)pause();\n  renderSteps();\n}\n$('btnPrev').onclick=()=>go(cur-1);$('btnNext').onclick=()=>go(cur+1);\n\n/* =====================================================================\n   Video dựng bằng SVG: 4 cảnh × 15 giây\n   ===================================================================== */\nconst DUR=60, SC=15;\nconst CUES=[\n  [0,'1.1','Buổi sáng, mẹ đang pha một bình sữa cho em bé.'],\n  [4.5,'1.2','Các em nhìn kìa, trên bình sữa có các vạch và con số.'],\n  [9,'1.3','Mẹ rót nước vừa đúng đến vạch 120.'],\n  [15,'1.4','Bạn nhỏ bị ho, cần uống thuốc siro cho mau khỏi.'],\n  [19.5,'1.5','Chiếc cốc đong nhỏ xíu này cũng có các vạch chia.'],\n  [24,'1.6','Mỗi lần uống, chỉ rót đúng 5 ml thôi nhé.'],\n  [30,'1.7','Còn đây là một chiếc cốc có chia vạch rất rõ ràng.'],\n  [34.5,'1.8','50, 100, 150, 200, 250.'],\n  [39,'1.9','Rót nước vào cốc, nước dâng lên đúng vạch 200.'],\n  [45,'1.10','Chiếc chai to này chứa được đúng 1 lít nước.'],\n  [49.5,'1.11','Vậy lượng nước ít hơn 1 lít thì đo bằng gì nhỉ?'],\n  [54,'1.12','Các vạch chia trên cốc dùng để làm gì nhỉ?'],\n];\nconst film=$('film');\nconst clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));\nconst lerp=(a,b,k)=>a+(b-a)*k;\n/* ---------- thư viện hình (chuỗi SVG) ---------- */\nconst shadow=(cx,cy,rx,ry=rx*.16)=>`<ellipse cx=\"${cx}\" cy=\"${cy}\" rx=\"${rx}\" ry=\"${ry}\" fill=\"url(#shd)\"/>`;\nconst sparkle=(x,y,s=1,c='#ffd23f')=>`<path transform=\"translate(${x} ${y}) scale(${s})\" d=\"M0,-16 L4,-4 L16,0 L4,4 L0,16 L-4,4 L-16,0 L-4,-4 Z\" fill=\"${c}\"/>`;\n/* phông: tường + gạch ốp + mặt bàn gỗ */\nfunction bg({wall,tile='#ffffff',top=440,win=null,deco=''}){\n  let s=`<rect width=\"960\" height=\"540\" fill=\"url(#${wall})\"/>\n  <rect y=\"${top-150}\" width=\"960\" height=\"150\" fill=\"url(#tiles)\" opacity=\".55\"/>`;\n  if(win){const [x,y,w,h]=win;\n    s+=`<rect x=\"${x-10}\" y=\"${y-10}\" width=\"${w+20}\" height=\"${h+20}\" rx=\"14\" fill=\"#fff\" stroke=\"#e3d6c4\" stroke-width=\"3\"/>\n    <rect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"${h}\" rx=\"8\" fill=\"url(#sky)\"/>\n    <circle cx=\"${x+w*.78}\" cy=\"${y+h*.3}\" r=\"${h*.13}\" fill=\"#ffe27a\"/>\n    <g fill=\"#fff\" opacity=\".95\"><ellipse cx=\"${x+w*.3}\" cy=\"${y+h*.35}\" rx=\"${w*.14}\" ry=\"${h*.08}\"/><ellipse cx=\"${x+w*.4}\" cy=\"${y+h*.3}\" rx=\"${w*.1}\" ry=\"${h*.09}\"/><\/g>\n    <path d=\"M${x+w*.55},${y+h} q${w*.15},-${h*.35} ${w*.45},-${h*.25} v${h*.25} z\" fill=\"#9fd88a\"/>\n    <line x1=\"${x+w/2}\" y1=\"${y}\" x2=\"${x+w/2}\" y2=\"${y+h}\" stroke=\"#fff\" stroke-width=\"7\"/><line x1=\"${x}\" y1=\"${y+h/2}\" x2=\"${x+w}\" y2=\"${y+h/2}\" stroke=\"#fff\" stroke-width=\"7\"/>\n    <path d=\"M${x-26},${y-18} h${w*.32} q-${w*.08},${h*.6} -${w*.32},${h+30} z\" fill=\"#f59ab0\" opacity=\".9\"/>\n    <path d=\"M${x+w+26},${y-18} h-${w*.32} q${w*.08},${h*.6} ${w*.32},${h+30} z\" fill=\"#f59ab0\" opacity=\".9\"/>`;}\n  s+=deco;\n  s+=`<rect y=\"${top}\" width=\"960\" height=\"${540-top}\" fill=\"url(#wood)\"/>\n  <rect y=\"${top}\" width=\"960\" height=\"10\" fill=\"#fff\" opacity=\".35\"/>\n  <g stroke=\"#b9895a\" stroke-width=\"2\" opacity=\".35\" fill=\"none\"><path d=\"M0,${top+40} q240,-10 480,0 t480,0\"/><path d=\"M0,${top+75} q300,8 600,-2 t360,4\"/><\/g>`;\n  return s;\n}\n/* gương mặt bạn nhỏ: mood = happy | sick | think | baby */\nfunction face(x,y,r,mood='happy',hair='#3b2a20'){\n  const eyeY=y+r*.08,ex=r*.36;\n  let eyes='',mouth='',extra='';\n  if(mood==='happy'||mood==='baby'){eyes=[-1,1].map(d=>`<ellipse cx=\"${x+d*ex}\" cy=\"${eyeY}\" rx=\"${r*.1}\" ry=\"${r*.13}\" fill=\"#2b1d16\"/><circle cx=\"${x+d*ex+r*.04}\" cy=\"${eyeY-r*.05}\" r=\"${r*.04}\" fill=\"#fff\"/>`).join('');\n    mouth=`<path d=\"M${x-r*.22},${y+r*.38} Q${x},${y+r*.62} ${x+r*.22},${y+r*.38} Z\" fill=\"#c4473a\"/><path d=\"M${x-r*.1},${y+r*.5} Q${x},${y+r*.58} ${x+r*.1},${y+r*.5}\" fill=\"#ff8f86\"/>`;}\n  if(mood==='sick'){eyes=[-1,1].map(d=>`<path d=\"M${x+d*ex-r*.12},${eyeY} Q${x+d*ex},${eyeY+r*.09} ${x+d*ex+r*.12},${eyeY}\" stroke=\"#2b1d16\" stroke-width=\"${r*.05}\" fill=\"none\" stroke-linecap=\"round\"/>`).join('');\n    mouth=`<path d=\"M${x-r*.16},${y+r*.48} q${r*.08},-${r*.08} ${r*.16},0 t${r*.16},0\" stroke=\"#8d3b2f\" stroke-width=\"${r*.05}\" fill=\"none\" stroke-linecap=\"round\"/>`;\n    extra=`<g transform=\"translate(${x+r*.12} ${y+r*.46}) rotate(-25)\"><rect x=\"0\" y=\"-${r*.05}\" width=\"${r*.85}\" height=\"${r*.1}\" rx=\"${r*.05}\" fill=\"#fff\" stroke=\"#9aa7ad\" stroke-width=\"2\"/><rect x=\"${r*.62}\" y=\"-${r*.05}\" width=\"${r*.23}\" height=\"${r*.1}\" rx=\"${r*.05}\" fill=\"#e74c3c\"/><\/g>\n      <path d=\"M${x+r*.55},${y-r*.55} q${r*.06},${r*.14} 0,${r*.2} q-${r*.06},-${r*.06} 0,-${r*.2}z\" fill=\"#7cc6ee\"/>`;}\n  if(mood==='think'){eyes=[-1,1].map(d=>`<ellipse cx=\"${x+d*ex}\" cy=\"${eyeY}\" rx=\"${r*.1}\" ry=\"${r*.13}\" fill=\"#2b1d16\"/><circle cx=\"${x+d*ex+r*.04}\" cy=\"${eyeY-r*.07}\" r=\"${r*.045}\" fill=\"#fff\"/>`).join('')\n      +[-1,1].map(d=>`<path d=\"M${x+d*ex-r*.12},${eyeY-r*.26} q${r*.12},-${r*.08} ${r*.24},-${r*.02}\" stroke=\"${hair}\" stroke-width=\"${r*.05}\" fill=\"none\" stroke-linecap=\"round\"/>`).join('');\n    mouth=`<ellipse cx=\"${x+r*.08}\" cy=\"${y+r*.46}\" rx=\"${r*.09}\" ry=\"${r*.11}\" fill=\"#c4473a\"/>`;}\n  const back=mood==='baby'?'':`<circle cx=\"${x}\" cy=\"${y-r*.12}\" r=\"${r*1.06}\" fill=\"${hair}\"/>`;\n  const fringe=mood==='baby'\n    ?`<path d=\"M${x-r*.05},${y-r*.98} q${r*.3},-${r*.22} ${r*.18},${r*.12} q-${r*.08},${r*.1} -${r*.2},-${r*.02}\" fill=\"none\" stroke=\"#8a5a2b\" stroke-width=\"${r*.07}\" stroke-linecap=\"round\"/>`\n    :`<path d=\"M${x-r*1.02},${y-r*.05} Q${x-r*.95},${y-r*1.15} ${x},${y-r*1.08} Q${x+r*.95},${y-r*1.15} ${x+r*1.02},${y-r*.05} Q${x+r*.6},${y-r*.62} ${x+r*.1},${y-r*.5} Q${x-r*.4},${y-r*.72} ${x-r*1.02},${y-r*.05} Z\" fill=\"${hair}\"/>`;\n  return `${back}<circle cx=\"${x-r}\" cy=\"${y+r*.1}\" r=\"${r*.2}\" fill=\"#ffcfa8\"/><circle cx=\"${x+r}\" cy=\"${y+r*.1}\" r=\"${r*.2}\" fill=\"#ffcfa8\"/>\n    <circle cx=\"${x}\" cy=\"${y}\" r=\"${r}\" fill=\"url(#skin)\"/>${fringe}${eyes}\n    <ellipse cx=\"${x-r*.58}\" cy=\"${y+r*.34}\" rx=\"${r*.17}\" ry=\"${r*.1}\" fill=\"${mood==='sick'?'#ff6b6b':'#ff9aa2'}\" opacity=\"${mood==='sick'?.8:.6}\"/>\n    <ellipse cx=\"${x+r*.58}\" cy=\"${y+r*.34}\" rx=\"${r*.17}\" ry=\"${r*.1}\" fill=\"${mood==='sick'?'#ff6b6b':'#ff9aa2'}\" opacity=\"${mood==='sick'?.8:.6}\"/>${mouth}${extra}`;\n}\nfunction body(x,y,r,color){return `<path d=\"M${x-r*1.15},${y+r*2.6} Q${x-r*1.2},${y+r*1.05} ${x},${y+r*.95} Q${x+r*1.2},${y+r*1.05} ${x+r*1.15},${y+r*2.6} Z\" fill=\"${color}\"/>\n  <path d=\"M${x-r*.35},${y+r*.98} Q${x},${y+r*1.3} ${x+r*.35},${y+r*.98}\" fill=\"#fff\" opacity=\".85\"/>`;}\n/* vạch chia */\nconst ticks=(x,y0,k,from,to,step,major,lab,len=[14,26],fs=18)=>{let s='';for(let v=from;v<=to;v+=step){const y=y0-v*k,M=v%major===0;\n  s+=`<line x1=\"${x}\" x2=\"${x+(M?len[1]:len[0])}\" y1=\"${y}\" y2=\"${y}\" stroke=\"#22495a\" stroke-width=\"${M?3:2}\" stroke-linecap=\"round\"/>`;\n  if(M&&lab){const t=lab(v);if(t!=='')s+=`<text x=\"${x+len[1]+6}\" y=\"${y+6}\" font-size=\"${fs}\" font-weight=\"700\" fill=\"#22495a\">${t}<\/text>`;}}return s;};\n\nfilm.innerHTML=`<defs>\n  <linearGradient id=\"wallA\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#fff6e6\"/><stop offset=\"1\" stop-color=\"#ffe3bd\"/><\/linearGradient>\n  <linearGradient id=\"wallB\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#eaf5ff\"/><stop offset=\"1\" stop-color=\"#cfe6fa\"/><\/linearGradient>\n  <linearGradi nt` ml */\nasync function pourInto(src,jug,amount,{dur=1500,color='#5ab4e8',onSrc,back=true}={}){\n  const n=src.g, L=src.L, tx=jug.x+jug.w*.42+L*.9, ty=jug.y-L*.42-30, a={x:n._x,y:n._y};\n  SVG.appendChild(n);\n  if(!await tween(520,k=>setPos(n,a.x+(tx-a.x)*k,a.y+(ty-a.y)*k,-115*k)))return false;\n  const st=makeStream(color,n,jug.y), m=localPt(n,0,-L*.98), v0=jug.total();\n  sfx.pour();\n  const ok=await tween(dur,(e,lin)=>{jug.set(v0+amount*lin);st.show(m.x,m.y,jug.surfaceY());onSrc&&onSrc(lin);});\n  st.s.remove();if(!ok)return false;\n  if(back)await goHome(n,480);\n  return true;\n}\nfunction floatText(x,y,txt,color='#0f3f3d',fs=18){const t=el('text',{x,y,['text-anchor']:'middle',['font-size']:fs,['font-weight']:800,fill:color,class:'float-up'},SVG);t.textContent=txt;setTimeout(()=>t.remove(),1200);}\nfunction label(x,y,txt,{fs=18,color='#0f3f3d',w=0,bg='#fff',anchor='middle',weight=700}={}){\n  const g=el('g',{},SVG);const r=el('rect',{rx:10,fill:bg,stroke:'#dbe8e5',['stroke-width']:1.5},g);\n  const t=el('text',{x,y,['text-anchor']:anchor,['font-size']:fs,['font-weight']:weight,fill:color},g);\n  const set=s=>{t.textContent=s;const bb=t.getBBox();r.setAttribute('x',bb.x-10);r.setAttribute('y',bb.y-5);r.setAttribute('width',Math.max(w,bb.width+20));r.setAttribute('height',bb.height+10);};\n  set(txt);return{g,t,set};\n}\nfunction hintArrow(x,y,txt){const g=el('g',{class:'bob',['pointer-events']:'none'},SVG);\n  el('path',{d:`M${x},${y+18} l-9,-14 h6 v-16 h6 v16 h6 z`,fill:'#f3a712',stroke:'#fff',['stroke-width']:1.5},g);\n  if(txt){const t=el('text',{x,y:y-20,['text-anchor']:'middle',['font-size']:15,['font-weight']:700,fill:'#b06e00'},g);t.textContent=txt;}return g;}\n\n/* âm thanh phản hồi ngắn */\nconst sfx=(()=>{let c=null;const ac=()=>{try{c=c||new (window.AudioContext||window.webkitAudioContext)();if(c.state==='suspended')c.resume();}catch(e){}return c;};\n  const t=(f,t0,d,ty,v)=>{const x=ac();if(!x)return;const o=x.createOscillator(),g=x.createGain(); ,tip){ // tip: hướng dẫn hiện khi rê chuột / chạm vào nút ⓘ\n  if(tip)html=html.replace(/<\\/div>\\s*$/,`<span class=\"infobtn\" tabindex=\"0\" role=\"button\" aria-label=\"Hướng dẫn\">i<span class=\"tip\" role=\"tooltip\">${tip}<\/span><\/span><\/div>`);\n  dockEl.innerHTML=html;dockEl.style.display=html?'flex':'none';}\nconst head=(chip,title)=>`${chip?`<span class=\"chip\">${chip}<\/span>`:''}<h2>${title}<\/h2>`;\nconst nar=(t,av='🧒')=>`<div class=\"nar\"><div class=\"av\">${av}<\/div><div class=\"tx\">${t}<\/div><\/div>`;\nconst kcard=(h,body)=>`<div class=\"kcard\"><div class=\"kh\">${h}<\/div>${body}<\/div>`;\nfunction mcq(host,{q,opts,ok,okMsg,noMsg,onOk}){\n  host.innerHTML=`<div class=\"card\"><p><b>${q}<\/b><\/p><div class=\"opts\">${opts.map((o,i)=>`<button class=\"opt\" type=\"button\" data-i=\"${i}\"><i>${'ABCD'[i]}<\/i><span>${o}<\/span><\/button>`).join('')}<\/div><div class=\"fb\"><\/div><\/div>`;\n  const fb=$('.fb',host);\n  $$('.opt',host).forEach(b=>b.onclick=()=>{\n    const i=+b.dataset.i;\n    if(i===ok){b.classList.add('ok');$$('.opt',host).forEach(x=>x.disabled=true);fb.className='fb show ok';fb.innerHTML='✔ '+okMsg;sfx.ok();onOk&&onOk();}\n    else{b.classList.add('no');b.disabled=true;fb.className='fb show no';const m=Array.isArray(noMsg)?noMsg[i]:noMsg;fb.innerHTML='✘ '+(m||'Chưa đúng, em thử lại nhé!');sfx.no();}\n  });\n  host.scrollIntoView?.({behavior:'smooth',block:'nearest'});\n}\n/* điền số vào ô ? bằng cách chọn một trong các số */\nfunction pick(host,{q,opts,ok,noMsg,onOk}){\n  const d=document.createElement('div');d.className='cntq';\n  d.innerHTML=`<div class=\"lbl\">${q.replace('?','<span class=\"box\">?<\/span>')}<\/div><div class=\"nbs\">${opts.map(o=>`<button class=\"nb\" type=\"button\">${o}<\/button>`).join('')}<\/div>`;\n  host.appendChild(d);\n  $$('.nb',d).forEach((b,i)=>b.onclick=()=>{\n    if(i===ok){b.classList.add('ok');$$('.nb',d).forEach(x=>x.disabled=true);d.classList.add('done');$('.box',d).textContent=opts[i];sfx.ok();onOk&&onOk();}\n    else{b.classList.add('no');b.disabled=true;sfx.no();if(noMsg)toast(noMsg);}\n  });\n  setTimeout(()=>d.scrollIntoView({behavior:'smooth',block:'nearest'}),60);\n  return d;\n}\n/* danh sách kéo: 3 dòng hiển thị, dòng giữa là lựa chọn; bấm Kiểm tra */\nfunction wheel(host,{q,opts,ok,start=0,okMsg='Đúng rồi!',noMsg='Chưa đúng, thử lại nhé!',onOk}){\n  const d=document.createElement('div');d.className='wheelq';\n  d.innerHTML=`<p class=\"wq\">${q}<\/p><div class=\"wrow\"><div class=\"wheel\"><div class=\"wl\"><div class=\"wpad\"><\/div>${opts.map((o,i)=>`<div class=\"wi\" data-i=\"${i}\">${o}<\/div>`).join('')}<div class=\"wpad\"><\/div><\/div><\/div>\n    <button class=\"qbtn\" type=\"button\">Kiểm tra<\/button><\/div><div class=\"fb\"><\/div>`;\n  host.appendChild(d);\n  const wl=$('.wl',d),wh=$('.wheel',d),btn=$('.qbtn',d),fb=$('.fb',d),H=52;let done=false;\n  const idx=()=>Math.max(0,Math.min(opts.length-1,Math.round(wl.scrollTop/H)));\n  const mark=()=>{const i=idx();$$('.wi',d).forEach(e=>e.classList.toggle('on',+e.dataset.i===i));};\n  wl.addEventListener('scroll',()=>{mark();if(!done){wh.classList.remove('no');fb.className='fb';}});\n  /* kéo bằng chuột trên máy tính; chạm nhẹ vào dòng = chọn dòng đó */\n  let dr=null;\n  wl.addEventListener('pointerdown',e=>{if(done)return;dr={y:e.clientY,t:wl.scrollTop,m:false,mouse:e.pointerType==='mouse'};if(dr.mouse){wl.style.scrollSnapType='none';e.preventDefault();}});\n  addEventListener('pointermove',e=>{if(!dr)return;if(Math.abs(e.clientY-dr.y)>5)dr.m=true;if(dr.mouse)wl.scrollTop=dr.t-(e.clientY-dr.y);});\n  addEventListener('pointerup',e=>{if(!dr)return;const s=dr;dr=null;wl.style.scrollSnapType='';\n    let i=idx();if(!s.m){const it=e.target.closest&&e.target.closest('.wi');if(it&&d.contains(it))i=+it.dataset.i;}\n    wl.scrollTo({top:i*H,behavior:'smooth'});});\n  setTimeout(()=>{wl.scrollTop=start*H;mark();},0);\n  btn.onclick=()=>{if(done)return;const i=idx();\n    if(i===ok){done=true;wh.classList.add('ok');btn.disabled=true;wl.style.overflowY='hidden';fb.className='fb show ok';fb.innerHTML='✔ '+okMsg;sfx.ok();onOk&&onOk();}\n    else{wh.classList.remove('no');void wh.offsetWidth;wh.classList.add('no');fb.className='fb show no';fb.innerHTML='✘ '+noMsg;sfx.no();}};\n  setTimeout(()=>d.scrollIntoView({behavior:'smooth',block:'nearest'}),60);\n  return d;\n}\n/* tick hoàn thành nhiệm vụ của bước */\nfunction taskDone(){const t=$('.sec .say:not(.hint)');if(t&&!t.classList.contains('done')){t.classList.add('done');sfx.ok();}}\n/* câu chọn số dạng danh sách kéo: vals = các số (ml), ans = đáp án */\nconst R100=[100,200,300,400,500,600,700,800,900,1000];\nfunction numWheel(host,{q,vals=R100,ans,noMsg,onOk}){\n  const ok=vals.indexOf(ans);\n  return wheel(host,{q,opts:vals.map(v=>nf(v)+' ml'),ok,start:ok===0?1:0,noMsg,onOk});\n}\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};\n\n/* ---- thuyết minh: phát file audio theo mã (xem thuyet-minh.json) ---- */\nconst VO={\n  '1.1':'https://assets.yoolife.com.vn/yootek/1794906252961-6138.mp3',\n  '1.2':'https://assets.yoolife.com.vn/yootek/1794906256946-3507.mp3',\n  '2.1':'https://assets.yoolife.com.vn/yootek/1794906260906-3777.mp3',\n  '2.2':'https://assets.yoolife.com.vn/yootek/1794906264901-9807.mp3',\n  '3.1':'https://assets.yoolife.com.vn/yootek/1794906269455-3138.mp3',\n  '3.2':'https://assets.yoolife.com.vn/yootek/1794906273462-7665.mp3'\n};\nlet narrOn=true,voQ=[],voA=null;\nfunction stopVO(){voQ=[];if(voA){voA.pause();voA.onended=null;voA=null;}}\nfunction playNext(){if(!voQ.length){voA=null;return;}voA=new Audio(VO[voQ.shift()]);voA.onended=playNext;voA.play().catch(()=>{});}\nfunction speak(id,after){ // chỉ phát các mã có trong VO; after: chờ câu đang đọc xong rồi mới phát\n  const ids=(Array.isArray(id)?id:[id]).filter(x=>VO[x]);\n  if(!narrOn||!ids.length)return;\n  if(after&&voA&&!voA.paused&&!voA.ended){voQ.push(...ids);return;}\n  stopVO();voQ=ids;playNext();\n}\n$('#btnNarration').onclick=e=>{\n  narrOn=!narrOn;e.currentTarget.setAttribute('aria-pressed',narrOn);\n  if(narrOn)speak(STEPS[cur].say);else stopVO();\n};\n$('#btnFullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.().catch(()=>{});};\n\n/* =====================================================================\n   3. Nội dung các bước\n   ===================================================================== */\nconst STEPS=[\n/* ---------------- Rót hết nước từ bình sang 3 ca ---------------- */\n{label:'Ba ca nước',\n say:'1.1',\n mount(p){\n  stageSVG();scene();\n  const AMT={A:500,B:300,C:200};\n  const J={};\n  [['A',186],['B',326],['C',466]].forEach(([n,x])=>{J[n]=makeJug(SVG,{x,y:222,w:100,h:170,cap:500,minor:100,labels:[500],name:n,nameColor:'#d63384',nameFs:22,fs:12});});\n  const f=makeFlask(SVG,{cap:1000,ml:1000,tag:'?'});home(f.g,84,296);\n  const hint=hintArrow(84,150,'Kéo bình vào ca');\n  const left=new Set(['A','B','C']);\n  const pour=n=>run(async()=>{\n    if(!left.has(n))return;hint.remove();left.delete(n);\n    const a=f.ml;\n    if(!await pourInto(f,J[n],AMT[n],{dur:AMT[n]*4.2,onSrc:k=>f.set(a-AMT[n]*k)}))return;\n    sfx.pop();\n    if(left.size){toast(`Xong ca ${n}!`);return;}\n    taskDone();verdict('info','Bình hết nước!');\n    ask();\n  });\n  draggable(f.g,{canDrag:()=>left.size>0,onTap:()=>pour([...left][0]),\n    onDrop:pt=>{const n=[...left].find(k=>J[k].hit(pt,30));if(n){pour(n);return true;}\n      const done=['A','B','C'].find(k=>!left.has(k)&&J[k].hit(pt,30));toast(done?`Ca ${done} có nước rồi!`:'Thả vào ca nhé!');return false;}});\n  function ask(){\n    const h=$('#qa');h.innerHTML='<p class=\"say hint\">Ca A có <b>500 ml<\/b> nước.<\/p>';\n    numWheel(h,{q:'Ca B có bao nhiêu nước?',vals:[100,200,300,400,500],ans:300,noMsg:'Đếm lại vạch nhé!',\n      onOk(){numWheel(h,{q:'Ca C có bao nhiêu nước?',vals:[100,200,300,400,500],ans:200,noMsg:'Đếm lại vạch nhé!',\n        onOk(){numWheel(h,{q:'Lúc đầu bình có bao nhiêu nước?',ans:1000,noMsg:'Cộng ba ca lại nhé!',\n          onOk(){verdict('ok','✔ 1 000 ml');f.setTag('1 000 ml');speak('1.2',1);\n            $('#r').innerHTML=kcard('Ghi nhớ',`<p class=\"kmid\">500 + 300 + 200<\/p><p class=\"kbig\">= 1 000 ml = 1 l<\/p>`);\n            complete(0);}});}});}});\n  }\n  p.innerHTML=`${head('','Ba ca nước')}\n   <p class=\"say\"><span>Rót hết nước vào ca <b>A<\/b>, <b>B<\/b>, <b>C<\/b>.<\/span><\/p>\n   <div id=\"qa\"><\/div><div id=\"r\"><\/div>`;\n  dock(`<div class=\"grp\"><button class=\"dk\" id=\"bRe\" type=\"button\">↺ Làm lại<\/button><\/div>`,\n    'Kéo bình thả vào từng ca. Mỗi vạch là 100 ml.');\n  $('#bRe').onclick=()=>goTo(cur);\n }},\n\n/* ---------------- Phích 1 l rót ra 3 ca ---------------- */\n{label:'Phích nước',\n say:'2.1',\n mount(p){\n  stageSVG();scene();\n  const C=[{x:226,w:88,h:122,cap:200,name:'200 ml'},{x:350,w:88,h:122,cap:200,name:'200 ml'},{x:474,w:70,h:84,cap:100,name:'100 ml'}]\n    .map(c=>makeJug(SVG,{...c,y:392-c.h,minor:0,headroom:.14,nameFs:17,nameDy:24}));\n  const t=makeThermos(SVG,{cap:1000,ml:1000,tag:'1 l'});home(t.g,96,288);\n  const hint=hintArrow(96,140,'Kéo phích vào ca');\n  const left=new Set([0,1,2]);\n  const pour=i=>run(async()=>{\n    if(!left.has(i))return;hint.remove();left.delete(i);\n    const a=t.ml,v=C[i].cap;\n    if(!await pourInto(t,C[i],v,{dur:v*6,onSrc:k=>t.set(a-v*k)}))return;\n    sfx.pop();\n    if(left.size){toast(`Đầy ca ${C[i].cap} ml!`);return;}\n    taskDone();verdict('info','Phích còn bao nhiêu?');\n    ask();\n  });\n  draggable(t.g,{canDrag:()=>left.size>0,onTap:()=>pour([...left][0]),\n    onDrop:pt=>{const i=[...left].find(k=>C[k].hit(pt,30));if(i!==undefined){pour(i);return true;}toast('Thả vào ca còn trống nhé!');return false;}});\n  function ask(){\n    const h=$('#qa');\n    numWheel(h,{q:'1 l = ? ml',vals:[10,50,100  <div class=\"kb\"><div class=\"ki\">🥄 🪣<\/div><div class=\"kt\">Ít nước → <b class=\"kr\">ml<\/b><br>Nhiều nước → <b class=\"kr\">l<\/b><\/div><\/div>\n   <\/div>`;\n  complete(2);\n }});\n\n\n/* =====================================================================\n   4. Điều phối bước\n   ===================================================================== */\nlet cur=0;const finished=new Set();\nfunction renderBar(){\n  stepsBar.innerHTML=STEPS.map((s,i)=>`<button class=\"step ${finished.has(i)?'done':''}\" type=\"button\" data-i=\"${i}\" aria-pressed=\"${i===cur}\"><b>${finished.has(i)?'✓':i+1}<\/b><span>${s.label}<\/span><\/button>`).join('');\n  $('#btnPrev').disabled=cur<=0;\n  $('#btnNext').disabled=cur>=STEPS.length-1;\n  $('#btnNext').classList.toggle('nudge',finished.has(cur)&&cur<STEPS.length-1);\n  stepsBar.children[cur]?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});\n}\nstepsBar.onclick=e=>{const b=e.target.closest('.step');if(b)goTo(+b.dataset.i);};\n$('#btnPrev').onclick=()=>goTo(cur-1);\n$('#btnNext').onclick=()=>goTo(cur+1);\nwindow.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')goTo(cur+1);else if(e.key==='ArrowLeft')goTo(cur-1);});\n\nfunction complete(i){\n  finished.add(i);\n  renderBar();\n  if(i===cur&&i<STEPS.length-1&&!$('.next-wrap.go')){\n    const w=document.createElement('div');w.className='next-wrap go';\n    w.innerHTML=`<button class=\"qbtn next-btn\" type=\"button\">Tiếp tục: ${STEPS[i+1].label} ▶<\/button>`;\n    w.firstChild.onclick=()=>goTo(i+1);\n    $('.sec',sidebody).appendChild(w);\n    setTimeout(()=>w.scrollIntoView({behavior:'smooth',block:'nearest'}),150);\n  }\n}\nfunction resetScene(){epoch++;busy=false;verdict(null);dock('');view.innerHTML='';SVG=null;window.onStepLeave&&window.onStepLeave();window.onStepLeave=null;}\nfunction goTo(n){\n  n=Math.max(0,Math.min(STEPS.length-1,n));\n  cur=n;resetScene();$('#stage').classList.toggle('full',!!STEPS[n].full);\n  stopVO();\n  sidebody.innerHTML='<div class=\"sec\"><\/div>';sidebody.scrollTop=0;\n  STEPS[n].mount($('.sec',sidebody));\n  renderBar();\n  if(finished.has(n))complete(n);\n  speak(STEPS[n].say);\n}\n\n/* =====================================================================\n   5. Màn hình mở đầu\n   ===================================================================== */\nsetTimeout(()=>{clearInterval(window.__introTick);$('#introBar').style.width='100%';\n  $('#introStatus').innerHTML='<span class=\"ready-dot\"><\/span>Đã sẵn sàng!';$('#introLoader').classList.add('ready');},700);\n$('#btnExplore').onclick=()=>{\n  $('#introLoader').classList.add('gone');setTimeout(()=>$('#introLoader').style.display='none',500);\n  goTo(+(new URLSearchParams(location.search).get('step')||1)-1);\n};\nwindow.__lesson={goTo,STEPS};\n<\/script>\n<\/body>\n<\/html>\n"},{title:"Luyện tập",labels:["Luyện tập"],map:null,bar:null,html:"<!DOCTYPE html>\n<html lang=\"vi\">\n<head><script>window.__inIndex=1<\/script><style>.topbar{display:none!important}#intro,#introLoader{display:none!important}.app .steps,.stage-nav{display:none!important}<\/style><script>(function(){function run(){var e=document.getElementById('btnExplore')||document.getElementById('btnBegin'),il=document.getElementById('introLoader')||document.getElementById('intro');if(!e)return;if(il){var t=setInterval(function(){if(il.classList.contains('ready')||!document.getElementById('introBar')){clearInterval(t);e.click()}},150)}else e.click()}if(document.readyState==='complete')setTimeout(run,100);else window.addEventListener('load',function(){setTimeout(run,100)})})();<\/script>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover\">\n<link rel=\"icon\" href=\"data:,\">\n<title>Luyện tập | Toán 3 – Bài 32 | YooBook<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https: Pt(e){const p=SVG.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(SVG.getScreenCTM().inverse());}\nfunction localPt(node,x,y){const p=SVG.createSVGPoint();p.x=x;p.y=y;return p.matrixTransform(SVG.getScreenCTM().inverse().multiply(node.getScreenCTM()));}\n/* số có dấu cách hàng nghìn: 1000 → \"1 000\" */\nconst nf=v=>String(v).replace(/\\B(?=(\\d{3})+(?!\\d))/g,' ');\nconst ml=v=>v>=1000&&v%1000===0?`${v/1000} l`:`${nf(v)} ml`;\n\nlet epoch=0;\nconst ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;\nfunction tween(dur,fn){const my=epoch;return new Promise(res=>{const t0=performance.now();\n  const f=now=>{if(my!==epoch)return res(false);const lin=Math.min(1,(now-t0)/dur);fn(ease(lin),lin);lin<1?requestAnimationFrame(f):res(true);};requestAnimationFrame(f);});}\nconst wait=ms=>{const my=epoch;return new Promise(r=>setTimeout(()=>r(my===epoch),ms));};\nlet busy=false;\nasync function run(fn){if(busy)return;busy=true;try{await fn();}finally{busy=false;}}\n\n/* nền: tường sáng + mặt bàn gỗ */\nfunction scene(y0=392){\n  const d=el('defs',{},SVG);\n  d.innerHTML=`<linearGradient id=\"gWall\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#f7fcfb\"/><stop offset=\"1\" stop-color=\"#dcefe9\"/><\/linearGradient>\n  <linearGradient id=\"gTable\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#f0d3a3\"/><stop offset=\"1\" stop-color=\"#d9b07a\"/><\/linearGradient>\n  <linearGradient id=\"gGlass\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\"><stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\".55\"/><stop offset=\".7\" stop-color=\"#eaf6fb\" stop-opacity=\".35\"/><stop offset=\"1\" stop-color=\"#cfe6ef\" stop-opacity=\".55\"/><\/linearGradient>`;\n  el('rect',{x:0,y:0,width:640,height:460,rx:26,fill:'url(#gWall)'},SVG);\n  /* mặt bàn kéo dài xuống sau thanh nút, đáy bo tròn giống góc trên (rx 26) */\n  const tb=el('path',{fill:'url(#gTable)'},SVG),svg=SVG;\n  const fit=()=>{if(!svg.isConnected)return removeEventListener('resize',fit);const k=svg.getScreenCTM()?.a||1,B=460+Math.min(140,58/k);\n    tb.setAttribute('d',`M0,${y0} H640 V${B-26} A26,26 0 0 1 614,${B} H26 A26,26 0 0 1 0,${B-26} Z`);};\n  fit();requestAnimationFrame(fit);addEventListener('resize',fit);\n  el('rect',{x:0,y:y0,width:640,height:6,fill:'#c99b62',opacity:.7},SVG);\n  const cl=el('clipPath',{id:'cRound'},d);el('rect',{x:0,y:0,width:640,height:460,rx:26},cl);\n}\n\n/* đường viền ca có mỏ rót liền khối (thân thẳng, bo đáy). Trả về [viền, vành] */\nfunction jugOutline(x,y,w,h,r,spout=true){\n  if(!spout)return[`M${x},${y} L${x+w},${y} L${x+w},${y+h-r} Q${x+w},${y+h} ${x+w-r},${y+h} L${x+r},${y+h} Q${x},${y+h} ${x},${y+h-r} Z`,`M${x-3},${y} L${x+w+3},${y}`];\n  const T=`${x-w*.14},${y-h*.045}`,C2=`${x+w*.02},${y-h*.004}`,R=`${x+w*.2},${y}`,W=`${x},${y+h*.1}`,C1=`${x-w*.02},${y+h*.035}`;\n  return[`M${T} Q${C2} ${R} L${x+w},${y} L${x+w},${y+h-r} Q${x+w},${y+h} ${x+w-r},${y+h} L${x+r},${y+h} Q${x},${y+h} ${x},${y+h-r} L${W} Q${C1} ${T} Z`,\n         `M${T} Q${C2} ${R} L${x+w+3},${y}`];\n}\n/* Ca / cốc có vạch chia. x,y: góc trên-trái thân ca; cap: dung tích (ml) ở vạch trên cùng */\nlet JUGID=0;\nfunction makeJug(parent,o){\n  const {x,y,w,h,cap}=o, id='jug'+(++JUGID);\n  const minor=o.minor||0, labels=o.labels||[], r=Math.min(18,w*.14);\n  const top=y+h*(o.headroom??.12), bot=y+h-4, k=(bot-top)/cap;\n  const g=el('g',{class:'jug'},parent);\n  const [body,rim]=jugOutline(x,y,w,h,r,o.spout!==false);\n  const cp=el('clipPath',{id:id+'c'},g);el('path',{d:body},cp);\n  if(o.handle!==false)el('path',{d:`M${x+w-2},${y+h*.16} C${x+w+w*.34},${y+h*.14} ${x+w+w*.34},${y+h*.72} ${x+w-2},${y+h*.7}`,fill:'none',stroke:'#a9cdd8',['stroke-width']:Math.max(6,w*.07),['stroke-linecap']:'round'},g);\n  el('path',{d:body,fill:'#ffffff',opacity:.6},g);\n  const wg=el('g',{['clip-path']:`url(#${id}c)`},g);\n  const lay=[];\n  const surf=el('rect',{x,width:w,height:4,fill:'#fff',opacity:.55},wg);\n  // vạch chia\n  const tg=el('g',{},g);const fs=o *l.ml/t;});return c;}\nfunction glassAlarm(on){glassMat.color.set(on?'#ff7b7b':'#e4f6fc');glassMat.opacity=on?.42:.26;}\n\n/* ---- dòng chất lỏng khi rót ---- */\nconst STR=mesh(new THREE.CylinderGeometry(.032,.032,1,10),new THREE.MeshStandardMaterial({color:'#7cc6ee',transparent:true,opacity:.9,roughness:.2}));STR.visible=false;\nfunction stream(from,toY,color){STR.visible=true;STR.material.color.set(color);const h=Math.max(.01,from.y-toY);STR.scale.y=h;STR.position.set(from.x,toY+h/2,from.z);}\n\n/* ---- cốc ---- */\nfunction makeCup(home){const g=new THREE.Group();g.position.copy(home);scene.add(g);\n  const gm=mesh(new THREE.CylinderGeometry(.27,.21,.64,36,1,true),new THREE.MeshStandardMaterial({color:'#e8f7fd',transparent:true,opacity:.32,roughness:.08,side:THREE.DoubleSide,depthWrite:false}),0,.32,0,g);gm.renderOrder=2;\n  mesh(new THREE.CylinderGeometry(.21,.21,.04,32),new THREE.MeshStandardMaterial({color:'#e8f7fd',transparent:true,opacity:.6}),0,.02,0,g);\n  mesh(new THREE.TorusGeometry(.27,.015,8,40),M('#cbe9f3',{roughness:.2}),0,.64,0,g).rotation.x=Math.PI/2;\n  const liq=mesh(new THREE.CylinderGeometry(.235,.2,1,32),new THREE.MeshStandardMaterial({color:'#fff',transparent:true,opacity:.94,roughness:.3}),0,.04,0,g);liq.renderOrder=1;liq.visible=false;\n  const straw=mesh(new THREE.CylinderGeometry(.025,.025,.9,10),M('#ff7aa2'),.08,.6,0,g);straw.rotation.z=-.22;straw.visible=false;\n  blob(g,.36);mesh(new THREE.CylinderGeometry(.34,.34,.9,10),HITMAT,0,.4,0,g);\n  const C={g,home,ml:0,liq,straw,set(ml,color){C.ml=ml;if(color)liq.material.color.copy(color);const h=ml/300*.56,rc=y=>.21+.06*y/.64-.022;liq.visible=ml>0;if(ml>0){liq.geometry.dispose();liq.geometry=new THREE.CylinderGeometry(rc(.04+h),rc(.04),h,32);}liq.scale.y=1;liq.position.y=.04+h/2;}};\n  g.userData.ref=C;return C;}\nconst CUP=makeCup(new V3(1.3,0,1.6));\n\n/* ---- mũi tên gợi ý ---- */\nconst ARROW=new THREE.Group();scene.add(ARROW);ARROW.visible=false;\nmesh(new THREE.ConeGeometry(.13,.26,20),M('#ffb703',{emissive:'#ff9500',emissiveIntensity:.35}),0,0,0,ARROW).rotation.x=Math.PI;\nmesh(new THREE.CylinderGeometry(.05,.05,.22,12),M('#ffb703',{emissive:'#ff9500',emissiveIntensity:.35}),0,.2,0,ARROW);\nlet arrowAt=null;function arrow(p){arrowAt=p?p.clone():null;ARROW.visible=!!p;}\n\n/* ---- ngôi sao bay lên ---- */\nconst starGeo=(()=>{const s=new THREE.Shape();for(let i=0;i<10;i++){const r=i%2?.045:.11,a=Math.PI/2+i*Math.PI/5;i?s.lineTo(Math.cos(a)*r,Math.sin(a)*r):s.moveTo(Math.cos(a)*r,Math.sin(a)*r);}return new THREE.ShapeGeometry(s);})();\nconst PARTS=[];\nfunction sparkle(pos,n=10,colors=['#ffd23f','#ffb703','#ff8fab','#7fd3a3']){for(let i=0;i<n;i++){\n  const m=new THREE.Mesh(starGeo,new THREE.MeshBasicMaterial({color:colors[i%colors.length],transparent:true,depthWrite:false}));m.position.copy(pos);m.renderOrder=5;scene.add(m);\n  const a=Math.random()*Math.PI*2;PARTS.push({m,v:new V3(Math.cos(a)*.9,1.4+Math.random()*1.2,Math.sin(a)*.5),life:1,s:.7+Math.random()*.8});}}\n\n/* ---- khách hàng: thú bông tròn trịa ---- */\nfunction critter(kind){\n  const C={bunny:['#fbf5ee','#ffc8d5'],bear:['#c99467','#f3d6b6'],cat:['#ffb067','#fff0de'],dog:['#efdcc2','#9b6b46'],chick:['#ffe36b','#ffbf47']}[kind];\n  const g=new THREE.Group(),m=M(C[0],{roughness:.85}),m2=M(C[1],{roughness:.85}),dark=M('#2b2b33',{roughness:.35});\n  const S=(r,mat,x,y,z,sx=1,sy=1,sz=1)=>{const s=mesh(new THREE.SphereGeometry(r,32,24),mat,x,y,z,g);s.scale.set(sx,sy,sz);return s;};\n  S(.62,m,0,.75,0,1,1.05,.9);S(.4,m2,0,.72,.33,1,1,.55);S(.58,m,0,1.85,0);\n  [-1,1].forEach(s=>{S(.075,dark,.2*s,1.9,.52);S(.026,M('#ffffff'),.2*s+.025,1.935,.585);\n    const bl=mesh(new THREE.CircleGeometry(.085,24),new THREE.MeshBasicMaterial({color:'#ff9fb2',transparent:true,opacity:.8}),.34*s,1.74,.472,g);bl.lookAt(.68*s,1.74,1.5);\n    S(.15,kind==='chick'?m2:m,.6*s,.98,.15,1,.8,.8);\n    if(kind==='bunny'){const e=mesh(new THREE.CapsuleGeometry(.11,.5,8,16),m,.2*s,2.55,-.02,g);e.rotation.z=-.15*s;\n      const ei=mesh(new THREE.CapsuleGeometry(.06,.36,6,12),m2,.2*s,2.55,.07,g);ei.rotation.z=-.15*s;ei.scale.z=.4;}\n    if(kind==='bear'){S(.19,m,.4*s,2.27,0);S(.1,m2,.42*s,2.29,.11,1,1,.5);}\n    if(kind==='cat'){const e=mesh(new THREE.ConeGeometry(.18,.34,20),m,.33*s,2.3,0,g);e.rotation.z=-.35*s;\n      const ei=mesh(new THREE.ConeGeometry(.1,.2,16),m2,.33*s,2.28,.08,g);ei.rotation.z=-.35*s;}\n    if(kind==='dog'){const e=S(.2,m2,.55*s,1.92,0,.55,1.2,.7);e.rotation.z=.35*s;}\n  });\n  const mo=mesh(new THREE.TorusGeometry(.06,.017,8,20,Math.PI),dark,0,1.74,.565,g);mo.rotation.z=Math.PI;\n  if(kind==='chick'){mo.visible=false;const bk=mesh(new THREE.ConeGeometry(.08,.17,16),M('#ff8a1f'),0,1.79,.62,g);bk.rotation.x=Math.PI/2;\n    [[-.07,2.47,.1],[0,2.52,0],[.07,2.47,-.06]].forEach(([a,b,c])=>S(.08,m,a,b,c,.7,1.2,.7));}\n  else S(.055,dark,0,1.81,.578,1.25,.85,1);\n  g.scale.setScalar(.95);return{g,top:2.7*.95};\n}\nlet CUS=null;\nconst BUB=document.createElement('div');BUB.className='bub off';LAB.appendChild(BUB);\nfunction bubble(html){if(html){BUB.innerHTML=html;BUB.classList.remove('off');}else BUB.classList.add('off');}\nconst TRAYTAG=document.createElement('div');TRAYTAG.className='t3 tray';TRAYTAG.textContent='Giao đồ uống';LAB.appendChild(TRAYTAG);\nconst TK=document.createElement('div');TK.id='ticket';TK.className='off';$('#stage').appendChild(TK);\nconst POP=document.createElement('div');POP.id='pop';POP.className='off';$('#stage').appendChild(POP);\nLAB.appendChild(LIDTAG);LAB.appendChild(HOLDTAG);\nconst RO=document.createElement('div');RO.className='ro off';\nRO.innerHTML='<div><span>Lượng vừa rót<\/span><b id=\"roNow\">0 ml<\/b><\/div><div><span>Tổng hiện tại<\/span><b id=\"roTot\">0 ml<\/b><\/div><div class=\"tg\"><span>Lượng cần đạt<\/span><b id=\"roTg\">0 ml<\/b><\/div>';\nLAB.appendChild(RO);\n\n/* =====================================================================\n   4. Trò chơi: Nhận đơn → Chọn nguyên liệu → Pha và lắc → Giao khách\n   ===================================================================== */\nconst G={phase:'idle'};let O=null,REQ={},PRE={},TT=0,amt={};\nconst PROC=['Chọn nguyên liệu','Pha và lắc','Giao khách'];\nconst nm=k=>ING[k].name, CAPML=300;\n/* chỗ đặt chai trên bàn pha chế (tối đa 4 chai) */\nconst SLOTS=[-1.1,-.6,-1.6,-2.1].map(x=>new V3(x,BC,1.5));\n\nfunction resetWorld(){\n  Object.values(BOT).forEach(b=>{b.g.position.copy(b.home);b.g.rotation.set(0,0,0);b.where='shelf';b.slot=null;b.open=false;b.cap.visible=true;b.cap.position.set(0,.7,0);b.cap.rotation.set(0,0,0);b.cap.scale.setScalar(1);b.ring.visible=false;b.glow=0;b.body.material.emissiveIntensity=0;});\n  SH.g.position.set(SHX,0,SHZ);SH.g.rotation.set(0,0,0);SH.inv=false;liqG.visible=true;if(typeof POURLIQ!=='undefined')POURLIQ.visible=false;scene.attach(LID);LID.position.copy(LIDHOME);LID.rotation.set(0,0,0);LID.visible=true;HOLDTAG.classList.add('off');glassAlarm(false);TRING.visible=false;\n  setLayers(O.req.filter(([k])=>PRE[k]).map(([k])=>({k,ml:PRE[k]})));\n  [CUP].forEach(c=>{scene.attach(c.g);c.g.visible=false;c.g.position.copy(c.home);c.g.rotation.set(0,0,0);c.g.scale.setScalar(1.2);c.set(0);c.straw.visible=false;});\n  STR.visible=false;arrow(null);bubble(null);RO.classList.add('off');\n  PARTS.splice(0).forEach(p=>scene.remove(p.m));\n  if(CUS)scene.remove(CUS.g);CUS=null;\n}\nfunction start(i,p){\n  TOK++;O=ORDERS[i];REQ=Object.fromEntries(O.req);PRE={...(O.pre||{})};TT=sumReq(O);\n  amt={};O.req.forEach(([k])=>amt[k]=PRE[k]||0);\n  Object.assign(G,{i,p,phase:'mix',need:O.req.filter(([k,v])=>v>(PRE[k]||0)).map(r=>r[0]),sel:null,hold:false,pouring:false,atPose:null,\n    sess:0,last:0,hist:[],poured:false,asked:!O.ask,shk:0,shVel:0,shOff:0,wob:0,cupFilled:false,cupMl:0,lock:false,pid:0,acc:0,drag:null});\n  resetWorld();panel(p);customerIn();enterMix();\n  window.onStepLeave=()=>{TOK++;TK.classList.add('off');POP.classList.add('off');G.phase='idle';G.hold=G.pouring=false;G.drag=null;STR.visible=false;bubble(null);RO.classList.add('off');arrow(null);};\n}\n\n/* ---- phiếu order ---- */\nfunction panel(p){\n  p.innerHTML='';POP.classList.add('off');\n  TK.innerHTML=`<div class=\"tk-h\"><span>Đơn ${G.i+1}/${ORDERS.length}<\/span><b>${O.drink}<\/b><\/div>\n    <div class=\"proc\">${PROC.map((s,j)=>`<span data-j=\"${j}\"><i>${j+1}<\/i><b>${s}<\/b><\/span>`).join('')}<\/div>\n    <div class=\"otab\"><table><thead><tr><th>Nguyên liệu<\/th><th>Cần<\/th><th>Đã có<\/th><\/tr><\/thead><tbody><\/tbody>\n    <tfoot><tr><td>Tổng<\/td><td>${TT} ml<\/td><td class=\"have\" id=\"tHave\">0 ml<\/td><\/tr><\/tfoot><\/table><\/div>`;\n  TK.classList.remove('off');updTable();fit();\n}\nconst extras=()=>Object.keys(amt).filter(k=>!(k in REQ)&&amt[k]>0);\nfunction updTable(){\n  const tb=$('#ticket tbody');\n  if(tb)tb.innerHTML=[...O.req.map(r=>r[0]),...extras()].map(k=>{const v=REQ[k],hide=O.ask?.hide&&O.ask.k===k&&!G.asked,a=amt[k]||0;\n    return `<tr data-k=\"${k}\" class=\"${v==null?'extra':a===v?'ok':a>v?'over':''}\"><td><i class=\"dot\" style=\"background:${ING[k].c}\"><\/i>${nm(k)}<\/td>\n      <td class=\"need\">${v==null?'—':hide?'<span class=\"q\">?<\/span>':v+' ml'}<\/td><td class=\"have\">${a} ml<\/td><\/tr>`;}).join('');\n  const t=$('#tHave'),tot=totMl();if(t)t.textContent=tot+' ml';\n  $('#roNow').textContent=Math.max(0,G.last||0)+' ml';$('#roTot').textContent=tot+' ml';$('#roTg').textContent=TT+' ml';\n  RO.classList.toggle('over',tot>TT);RO.classList.toggle('ok',allEq());\n  }\nfunction setProc(j){$$('.proc span').forEach(s=>{const n=+s.dataset.j;s.classList.toggle('done',n<j);s.classList.toggle('cur',n===j);});}\nconst allEq=()=>O&&O.req.every(([k,v])=>amt[k]===v)&&!extras().length;\n\n/* ---- khách đến ---- */\nasync function customerIn(){\n  CUS=critter(O.ani);scene.add(CUS.g);const a=new V3(6.2,GY,-2.15),b=new V3(2.55,GY,-2.15);CUS.g.position.copy(a);CUS.g.rotation.y=-.6;\n  if(!await tw(1300,(k,l)=>{CUS.g.position.lerpVectors(a,b,k);CUS.g.position.y=GY+Math.abs(Math.sin(l*Math.PI*5))*.16;CUS.g.rotation.y=-.6*(1-k);}))return;\n  bubble(O.say);\n}\n\n/* ---- Bước 1: vào quầy pha tự do (khách vừa đến là chọn nguyên liệu luôn) ---- */\nfunction enterMix(){\n  G.phase='mix';setProc(0);\n  RO.classList.remove('off');\n  dock(`<div class=\"grp\"><button class=\"dk\" id=\"bUndo\" type=\"button\">↶ Hoàn tác<\/button><button class=\"dk\" id=\"bRedo\" type=\"button\">⟲ Rót lại<\/button>\n<\/div>`,\n    'Kéo chai từ kệ xuống <b>bàn pha chế<\/b>. Chạm vào chai trên bàn để <b>mở nắp<\/b>. Kéo chai lên <b>miệng bình shake<\/b> rồi giữ để rót; thả tay để dừng. Pha xong thì kéo <b>nắp bình<\/b> đậy lên bình shake để lắc.');\n  $('#bUndo').onclick=undo;$('#bRedo').onclick=redo;\n  updTable();\n  if(O.ask)showAsk();\n  verdict('info','Chọn chai, mở nắp, rót vào bình!');\n}\nfunction showAsk(){\n  const a=O.ask,d=POP;\n  d.classList.remove('off','res');d.innerHTML=`<div class=\"cntq\"><button class=\"pclose\" type=\"button\" aria-label=\"Đóng\">✕<\/button><div class=\"ph\">🧮 Tính trước khi rót<\/div><div class=\"lbl\">${a.q.replace('?','<span class=\"box\">?<\/span>')}<\/div><div class=\"nbs\">${a.o.map(v=>`<button class=\"nb\" type=\"button\" data-v=\"${v}\">${v} ml<\/button>`).join('')}<\/div><\/div>`;\n  $('.pclose',d).onclick=()=>d.classList.add('off');\n  $$('.nb',d).forEach(b=>b.onclick=()=>{\n    if(+b.dataset.v===a.a){b.classList.add('ok');$$('.nb',d).forEach(x=>x.disabled=true);$('.cntq',d).classList.add('done');$('.box',d).textContent=a.a+' ml';\n      G.asked=true;sfx.ok();updTable();verdict('ok',`Đúng! Thêm ${a.a} ml`);\n      setTimeout(()=>{if(G.phase==='mix')POP.classList.add('off');},1300);}\n    else{b.classList.add('no');b.disabled=true;sfx.no();verdict('no','Tính lại nhé!');}\n  });\n}\n\n/* ---- chai: kệ ↔ bàn pha chế ---- */\nconst onTable=()=>Object.values(BOT).filter(b=>b.slot!=null);\nasync function toSlot(b){\n  if(b.slot==null){const used=onTable().map(x=>x.slot),i=SLOTS.findIndex((_,j)=>!used.includes(j));\n    if(i<0){toast('Bàn pha chế đầy rồi – cất bớt chai về kệ nhé!');return toShelf(b);}b.slot=i;sfx.pop();}\n  b.where='moving';\n  if(!await moveTo(b.g,SLOTS[b.slot],380,{arc:.3,rz:0}))return;\n  b.where='slot';b.ring.visible=true;\n}\nasync function toShelf(b){\n  b.slot=null;b.ring.visible=false;b.where='moving';if(G.sel===b.k)G.sel=null;\n  if(!await moveTo(b.g,b.home,380,{arc:.3,rz:0}))return;b.where='shelf';\n}\n\n/* ---- Bước 2–3: rót (kéo chai vào bình, hoặc giữ nút Rót) ---- */\nconst POSE_RZ=-2.0,POUR_MS=250; // tốc độ rót: 10 ml mỗi 250 ms\nfunction poseOf(){const h=BH-BC-.01,s=Math.sin(POSE_RZ),c=Math.cos(POSE_RZ);return new V3(SHX+h*s,SH_H+.28-h*c,SHZ);} // tâm chai để miệng chai nằm trên miệng bình\nasync function bringToPose(b,dur=300){\n  if(G.atPose&&G.atPose!==b)await sendBack(G.atPose,180);\n  G.atPose=b;b.where='pose';b.ring.visible=false;\n  return moveTo(b.g,poseOf(),dur,{arc:dur>200?.25:0,rz:POSE_RZ});\n}\nasync function sendBack(b,dur=380){if(G.atPose===b)G.atPose=null;if(b.slot==null)return toSlot(b);b.where='moving';const ok=await moveTo(b.g,SLOTS[b.slot],dur,{arc:.2,rz:0});if(ok){b.where='slot';b.ring.visible=true;}}\nfunction snapshot(){return{amt:{...amt},L:SH.layers.map(l=>({k:l.k,ml:l.ml}))};}\nfunction beginPour(k){G.sel=k;G.pid++;G.hist.push(snapshot());G.sess=amt[k]||0;G.last=0;verdict(null);}\nfunction addTen(){\n  if(totMl()>=CAPML){toast('Bình đầy rồi!');sfx.no();return false;}\n  const k=G.sel;amt[k]=(amt[k]||0)+10;addMl(k,10);G.last=amt[k]-G.sess;blip(520+Math.random()*380,.06,.03);\n  if(!G.poured){G.poured=true;setProc(1);}\n  const b=BOT[k];stream(b.g.localToWorld(new V3(0,BH-BC-.02,0)),LY0+totMl()*K,ING[k].c);\n  updTable();return true;\n}\nfunction endPour(back=true){\n  STR.visible=false;const b=G.atPose,id=G.pid;\n  if(back&&b)sleep(550).then(ok=>{if(ok&&id===G.pid&&!G.hold&&!G.drag&&G.atPose===b)sendBack(b);});\n  if(G.sel&&G.last)verdict('info',`Bình có ${totMl()} ml`);\n  updTable();\n}\n/* kéo chai lên miệng bình: chai tự nghiêng và rót liên tục */\n/* mở nắp chai: chạm vào chai trên bàn → nắp bật lên rồi biến mất */\nasync function openCap(b){\n  if(b.open)return;b.open=true;sfx.pop();blip(900,.08,.05);\n  verdict('info','Đã mở nắp!');\n  const c=b.cap;await tw(420,(k,l)=>{c.position.set(.12*l,.7+.45*Math.sin(Math.PI*Math.min(1,l*1.2))+.2*l,0);c.rotation.z=-2.5*l;c.scale.setScalar(1-.9*Math.max(0,l-.6)/.4);},lin);\n  c.visible=false;\n}\nasync function dragPourStart(d){\n  const b=d.o;\n  if(!b.open){if(!d.warned){d.warned=true;toast('Chai còn đóng nắp – chạm vào chai trên bàn để mở nắp nhé!');sfx.no();}return;}d.pouring=true;d.wasPour=true;G.atPose=b;beginPour(b.k);\n  b.where='pose';await moveTo(b.g,poseOf(),150,{rz:POSE_RZ});\n  if(!d.pouring||G.drag!==d)return;\n  if(!addTen()){d.pouring=false;return;}\n  G.pouring=true;G.acc=0;\n}\nfunction dragPourStop(d){d.pouring=false;G.pouring=false;STR.visible=false;if(G.atPose===d.o)G.atPose=null;d.o.where='drag';d.o.g.rotation.z=0;endPour(false);}\nfunction undo(){\n  if(G.phase!=='mix'||G.hold||G.drag)return;const s=G.hist.pop();if(!s){toast('Chưa có lượt rót nào để hoàn tác.');return;}\n  amt=s.amt;setLayers(s.L);G.last=0;G.poured=G.hist.length>0;\n  verdict('info',`Bình có ${totMl()} ml`);updTable();\n}\nfunction redo(){\n  if(G.phase!=='mix'||G.hold||G.drag)return;\n  amt={};O.req.forEach(([k])=>amt[k]=PRE[k]||0);setLayers(O.req.filter(([k])=>PRE[k]).map(([k])=>({k,ml:PRE[k]})));G.hist=[];G.last=0;G.poured=false;\n  verdict('info','Pha lại từ đầu nhé!');updTable();\n}\n\n/* ---- Bước 4: đậy nắp → chạm giữ bình để lắc ---- */\nasync function closeLid(){\n  if(!G.poured){toast('Em rót nguyên liệu vào bình shake trước nhé!');sfx.no();moveTo(LID,LIDHOME,350,{arc:.2});return;}\n  G.phase='shake';G.lock=true;G.shHold=false;RO.classList.add('off');POP.classList.add('off');arrow(null);verdict(null);\n  if(G.atPose){const b=G.atPose;G.atPose=null;moveTo(b.g,SLOTS[b.slot],250,{rz:0}).then(()=>{b.where='slot';});}\n  Object.values(BOT).forEach(b=>b.ring.visible=false);\n  const top=new V3(SHX,SH_H-.02,SHZ);\n  /* bay vòng lên trên miệng bình, dựng thẳng */\n  const r0=LID.rotation.clone();\n  if(!await moveTo(LID,top.clone().setY(SH_H+.55),360,{arc:.35}))return;\n  LID.rotation.set(0,0,0);\n  /* hạ xuống vừa xoay như vặn nắp */\n  if(!await tw(420,(k,l)=>{LID.position.y=top.y+.55*(1-k);LID.rotation.y=-Math.PI*1.6*k;if(Math.random()<.18)blip(1400+Math.random()*400,.03,.02,'square');}))return;\n  SH.g.attach(LID);LID.position.set(0,SH_H-.02,0);LID.rotation.set(0,0,0);\n  /* \"tách\" + bình nhún nhẹ */\n  blip(1100,.06,.06,'triangle');sfx.pop();\n  await tw(260,(k,l)=>{const q=Math.sin(Math.PI*l);SH.g.scale.set(1+.03*q,1-.05*q,1+.03*q);});SH.g.scale.set(1,1,1);\n  dock(`<div class=\"grp\"><div class=\"shbar\"><span id=\"shBar\"><\/span><\/div><span class=\"shp\" id=\"shP\">0%<\/span><\/div>`,\n    'Chạm vào bình shake và <b>giữ<\/b> để lắc (hoặc giữ phím <b>Space<\/b>). Thả tay thì bình dừng lắc.');\n  verdict('info','Giữ bình để lắc!');\n  HOLDTAG.classList.remove('off');G.lock=false;\n}\nfunction addShake(p){\n  if(G.phase!=='shake'||G.lock)return;\n  G.shk=Math.min(100,G.shk+p);\n  const mix=mixColor(),f=G.shk/100;SH.layers.forEach(l=>l.m.material.color.copy(l.c0).lerp(mix,f));renderLayers();\n  $('#shBar').style.width=G.shk+'%';$('#shP').textContent=Math.round(G.shk)+'%';\n  if(G.shk>=100){G.shHold=false;finishShake();}\n}\nasync function finishShake(){\n  G.phase='mixed';G.lock=true;HOLDTAG.classList.add('off');sfx.win();verdict('ok','Lắc xong!');\n  sparkle(new V3(SHX,SH_H+.4,SHZ),12);\n  await sleep(700);\n  /* vặn ngược để mở nắp, rồi đặt nắp về bàn */\n  if(!await tw(380,k=>{LID.position.y=SH_H-.02+.5*k;LID.rotation.y=Math.PI*1.6*k;}))return;\n  scene.attach(LID);LID.rotation.set(0,0,0);moveTo(LID,LIDHOME,450,{arc:.35});\n  await tw(300,k=>{SH.g.position.x=SHX+G.shOff*(1-k);SH.g.rotation.z*=1-k;});G.shOff=0;\n  enterServe();\n}\n\n/* ---- Bước 5: giao khách ---- */\nasync function enterServe(){\n  G.phase='serve';G.lock=false;setProc(2);G.cupMl=totMl();\n  CUP.g.visible=true;CUP.g.scale.setScalar(.01);\n  tw(420,k=>CUP.g.scale.setScalar(Math.max(.01,1.2*outBack(k))),lin);\n  dock(`<div class=\"grp\"><button class=\"dk pri\" id=\"bServe\" type=\"button\">🥤 Đổ ra cốc<\/button><\/div>`,\n    'Chạm vào bình shake hoặc bấm <b>Đổ ra cốc<\/b>. Sau đó kéo cốc đến khay <b>Giao đồ uống<\/b>.');\n  $('#bServe').onclick=pourToCup;\n  verdict('info','Đổ ra cốc nhé!');\n  arrow(new V3(SHX,SH_H+.55,SHZ));\n}\nrenderer.localClippingEnabled=true;\nconst PLANE=new THREE.Plane(new V3(0,-1,0),0);\nconst POURLIQ=mesh(new THREE.CylinderGeometry(RI(SH_H),RI(LY0),SH_H-LY0,40),\n  new THREE.MeshStandardMaterial({color:'#fff',roughness:.3,side:THREE.DoubleSide,clippingPlanes:[PLANE]}),0,(SH_H+LY0)/2,0,SH.g);\nPOURLIQ.visible=false;POURLIQ.renderOrder=1;\n/* mực nước ngang (toạ độ thế giới) cho lượng ml còn lại trong bình đang nghiêng */\nfunction pourLevel(ml){SH.g.updateMatrixWorld(true);\n  const ys=[[-RI(LY0),LY0],[RI(LY0),LY0],[-RI(SH_H),SH_H],[RI(SH_H),SH_H]].map(([x,y])=>SH.g.localToWorld(new V3(x,y,0)).y);\n  const lo=Math.min(...ys),hi=Math.max(...ys);PLANE.constant=lo+(hi-lo)*Math.min(1,ml*K/(SH_H-LY0));}\n/* điểm thấp nhất của miệng bình: nơi nước chảy ra */\nfunction lipPoint(){const a=SH.g.localToWorld(new V3(-RI(SH_H),SH_H,0)),b=SH.g.localToWorld(new V3(RI(SH_H),SH_H,0));return a.y<b.y?a:b;}\nasync function pourToCup(){\n  if(G.phase!=='serve'||G.cupFilled||G.lock)return;\n  G.lock=true;arrow(null);\n  const rz=-2.0,s=Math.sin(rz),c=Math.cos(rz),mouth=new V3(CUP.home.x-.04,1.32,CUP.home.z),base=new V3(mouth.x+SH_H*s,mouth.y-SH_H*c,mouth.z);\n  const a=SH.g.position.clone(),mix=mixColor(),T0=G.cupMl;\n  /* trong lúc rót: nước là một khối bị cắt bởi mặt phẳng NGANG → mặt nước luôn nằm ngang */\n  POURLIQ.material.color.copy(mix);liqG.visible=false;POURLIQ.visible=true;pourLevel(T0);\n  if(!await tw(800,k=>{SH.g.position.lerpVectors(a,base,k);SH.g.position.y+=Math.sin(Math.PI*k)*.4;SH.   }
  setInterval(sync,250);

  function setMute(on){
    btnMute.setAttribute('aria-pressed', on?'true':'false');
    btnMute.setAttribute('aria-label', on?'Bật âm thanh':'Tắt âm thanh');
    btnMute.textContent = on?'🔇':'🔊';
  }
  function innerMute(){ const d=innerDoc(); return d && d.querySelector('#btnMute,#mute'); }
  view.addEventListener('load',()=>{ docLoaded=true; btnMute.hidden=!innerMute(); setMute(false); });
  btnMute.addEventListener('click',()=>{
    const m=innerMute(); if(!m) return;
    m.click(); setMute(btnMute.getAttribute('aria-pressed')!=='true');
  });

  /* ----- chuyển bước ----- */
  let pending=null;
  function loadPart(p){ document.body.classList.toggle('no-nav', PARTS[p].title==='Mở rộng'); docLoaded=false; btnMute.hidden=true; view.srcdoc=PARTS[p].html; curPart=p; title.textContent=PARTS[p].title; }

  async function clickInner(local, tk){
    // đợi phần học nạp xong rồi mới bấm vào bước con tương ứng
    const t0=Date.now();
    while(tk===token){
      const btns=innerBtns();
      if(btns && btns[local] && innerReady()) break;
      if(Date.now()-t0>45000) return;
      await new Promise(r=>setTimeout(r,150));
    }
    if(tk!==token) return;
    const btn=innerBtns()[local];
    if(local>0 && isLockedBtn(btn)){ showToast('Hãy hoàn thành bước hiện tại để mở bước tiếp theo.'); return; }
    if(btn.getAttribute('aria-pressed')!=='true') btn.click();
  }

  async function go(g){
    g=Math.max(0,Math.min(STEPS.length-1,g));
    const s=STEPS[g], tk=++token;
    if(s.part===curPart){
      const btns=innerBtns();
      if(btns){
        if(g!==cur && s.local>0 && btns[s.local] && isLockedBtn(btns[s.local])){ showToast('Hãy hoàn thành bước hiện tại (học hoặc trả lời đúng) để mở bước tiếp theo.'); return; }
        pending=null; cur=g; render(); await clickInner(s.local,tk); return;
      }
      cur=g; render(); return;
    }
    cur=g; pending=g; loadPart(s.part); render();
    if(PARTS[s.part].bar) await clickInner(s.local,tk);
    if(tk===token) pending=null;
  }
  btnPrev.addEventListener('click',()=>go(cur-1));
  btnNext.addEventListener('click',()=>go(cur+1));
  $('btnReload').addEventListener('click',()=>{ if(cur<0) return; const s=STEPS[cur]; curPart=-1; go(cur); });

  $('btnFullscreen').addEventListener('click',()=>{
    const el=document.documentElement;
    if(!document.fullscreenElement) (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);
    else (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);
  });
  window.addEventListener('keydown',(e)=>{
    if(e.target!==document.body) return;
    if(e.key==='ArrowRight') go(cur+1); else if(e.key==='ArrowLeft') go(cur-1);
  });

  $('btnExplore').addEventListener('click',()=>{
    const l=$('introLoader'); l.classList.add('gone'); setTimeout(()=>{l.style.display='none';},420);
    if(cur<0) go(0);
  });

  render();
})();
</script>
</body>
</html>
